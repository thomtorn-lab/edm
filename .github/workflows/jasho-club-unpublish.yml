name: Jasho Club Unpublish

# One-time, deliberately temporary workflow (admin unpublish/cancellation
# safety work package, reference case, 2026-09-06). Mirrors this repo's
# established one-time-correction pattern (vega-venue-model-cleanup.yml):
# added, run once, then removed. Runs src/db/jashoClubUnpublish.ts, which
# admin-unpublishes "Jasho Club // Poolen Outside" (e-c098bf44) via the
# exact same sanctioned adminUnpublishEvent() write path the new admin UI's
# UNPUBLISH button calls — no migration, no other event/source writes, no
# destructive action.
#
# Secrets used: DATABASE_URL only. Never echoed, printed, or logged.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '"plan" (read-only, default) or "apply" (writes)'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      confirm:
        description: 'apply mode only: type JASHO-CLUB-UNPUBLISH-2026-09-06 to confirm the write.'
        required: false

permissions:
  contents: read

concurrency:
  group: jasho-club-unpublish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Run Jasho Club unpublish
        run: |
          set -u
          args=(--mode="${{ inputs.mode }}")
          [ -n "${{ inputs.confirm }}" ] && args+=(--confirm="${{ inputs.confirm }}")
          node --env-file=.env.local --import tsx src/db/jashoClubUnpublish.ts "${args[@]}"

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
