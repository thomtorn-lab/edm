name: Venue Coverage Expansion

# One-time, deliberately temporary workflow (venue coverage expansion audit,
# 2026-08-29). Mirrors this repo's established one-time-correction pattern
# (tonserCleanup.ts, cultureBoxRoomConsolidation.ts, hangarenEndDatetimeCorrection.ts):
# added, run once, then removed. Runs src/db/venueCoverageExpansion.ts, which
# corrects 3 venue addresses and adds one new venue (Ungdomshuset) via the
# existing human-gated createVenue()/updateVenueAddress()/updateVenueProfile()
# write paths — no migration, no event/source writes, no destructive action.
# Preview and Production share one Supabase database, so this reaches the
# real shared instance regardless of which branch this workflow runs from.
#
# Secrets used: DATABASE_URL only. Never echoed, printed, or logged.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '"plan" (read-only, default) or "apply" (writes)'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      confirm:
        description: 'apply mode only: type VENUE-COVERAGE-EXPANSION-2026-08-29 to confirm the writes.'
        required: false

permissions:
  contents: read

concurrency:
  group: venue-coverage-expansion
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pinned to the reviewed, not-yet-merged feature branch)
        uses: actions/checkout@v4
        with:
          ref: claude/venue-coverage-expansion-aggressive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Run venue coverage expansion
        run: |
          set -u
          args=(--mode="${{ inputs.mode }}")
          [ -n "${{ inputs.confirm }}" ] && args+=(--confirm="${{ inputs.confirm }}")
          node --env-file=.env.local --import tsx src/db/venueCoverageExpansion.ts "${args[@]}"

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
