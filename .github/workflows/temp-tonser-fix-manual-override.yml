name: TEMP - tonser Fix Manual Override

# One-time, deliberately temporary workflow (Electronic CPH Data Quality &
# Trust, Round 5 follow-up correction). The prior tonser cleanup
# (temp-tonser-cleanup.yml, already run and removed) reused setEventPublished
# to unpublish the stale 2026-09-19 row (e-71712e71) — which, via
# applyAdminEventEdit, unconditionally set manualOverride=true. That was
# never the intent (the approved plan was "unpublish, preserve row/
# provenance", never "turn this into an editorial override"). Runs
# src/db/tonserCleanup.ts --mode=fix-manual-override, which clears
# manualOverride back to false and removes "published" from
# overriddenFields on that one row only, after re-verifying it is still
# exactly the expected row (published=false, manualOverride=true) — never
# touches the live 2027-02-20 canonical row. Will be removed once this run
# is confirmed.
#
# Safety:
#   - workflow_dispatch only.
#   - Requires typing the exact confirmation string, matching this repo's
#     existing confirm-gate convention.
#   - Aborts with no write if Production state doesn't match what this fix
#     was validated against.
#   - DATABASE_URL is read only into the step environment via .env.local,
#     removed at the end of the run — never echoed or logged.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Must be exactly "FIX-TONSER-MANUAL-OVERRIDE"'
        required: true

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Run fix
        run: node --env-file=.env.local --import tsx src/db/tonserCleanup.ts --mode=fix-manual-override --confirm="${{ inputs.confirm }}"

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
