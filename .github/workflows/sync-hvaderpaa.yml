name: Sync HvadErPå

# Scheduling entry point for the HvadErPå ingestion adapter
# (src/lib/adapters/hvaderpaaAdapter.ts). Calls the deployed app's
# POST /api/sync/hvaderpaa on a fixed schedule, matching
# src/lib/data/sources.ts's `syncFrequency` for src-hvaderpaa ("every 6h").
#
# Same structure/safety model as sync-kultunaut.yml and friends — see
# README.md's "Scheduling" section. This source is discovery-only
# (autoPublish: false, enforced in src/db/sync.ts) and Phase-1-scoped to
# exactly four venue pages (Den Anden Side, MODULE, Jolene, Baggen) — every
# sync here can only ever create Discovery Queue rows, never a published
# event, no matter what the shared pipeline itself would otherwise decide —
# see hvaderpaaAdapter.ts's own module doc comment for the full audit trail.
#
# SYNC_BASE_URL / SYNC_TRIGGER_TOKEN / VERCEL_AUTOMATION_BYPASS_SECRET are
# shared repository-level secrets/variable already configured for the other
# sync-*.yml workflows. Cron offset (:55) doesn't collide with Hangaren
# (:00), ALICE (:05), Poolen (:15), Gravity (:20), Culture Box (:30),
# KultuNaut (:35), Billetto (:45) or Pumpehuset (:50).

on:
  schedule:
    - cron: "55 */6 * * *"
  workflow_dispatch: {} # manual re-trigger, e.g. the first post-merge sync or a retry after a fix

concurrency:
  group: sync-hvaderpaa
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger HvadErPå sync
        env:
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          if [ -z "${SYNC_BASE_URL}" ]; then
            echo "::error::Repository variable SYNC_BASE_URL is not set."
            exit 1
          fi
          if [ -z "${SYNC_TRIGGER_TOKEN}" ]; then
            echo "::error::Repository secret SYNC_TRIGGER_TOKEN is not set."
            exit 1
          fi
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "::error::Repository secret VERCEL_AUTOMATION_BYPASS_SECRET is not set."
            exit 1
          fi

          http_code=$(curl -sS \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 120 \
            -o /tmp/sync-response.json -w '%{http_code}' \
            -X POST \
            -H "x-sync-token: ${SYNC_TRIGGER_TOKEN}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${SYNC_BASE_URL}/api/sync/hvaderpaa")

          echo "HTTP status: ${http_code}"
          echo "Response:"
          cat /tmp/sync-response.json
          echo

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::HvadErPå sync returned HTTP ${http_code} — see response body above."
            exit 1
          fi
