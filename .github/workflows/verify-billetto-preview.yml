name: Verify Billetto Preview Sync

# One-off, manual, confirmation-gated validation of the real Billetto
# adapter against the claude/billetto-electronic-cph-pn5ggy Preview
# deployment. Mirrors verify-poolen-preview.yml's exact safe pattern: every
# database connection runs its queries inside one explicit read-only
# transaction (BEGIN; SET LOCAL default_transaction_read_only = on; ...;
# ROLLBACK), closed before the next step opens its own -- this workflow
# never runs db:migrate, any seed script, or any other mutating script
# itself. The only writes anywhere in this run happen inside the
# already-deployed Preview app's own /api/sync/billetto handler. Preview
# and Production currently share one Supabase database (see README), so
# this is a read against -- and real syncs against -- the actual shared
# instance.
#
# Triggers the sync TWICE (idempotency check per the task's explicit
# requirement) -- a healthy second run should create 0 new events and
# touch nothing that isn't a legitimate classification refresh on an
# already-pending item. Snapshots also cover Hangaren/Culture Box/Poolen
# (regression check: a Billetto sync must never touch their rows) and
# Billetto's own source-health fields.
#
# Secrets used: DATABASE_URL (read-only queries only), SYNC_TRIGGER_TOKEN
# and VERCEL_AUTOMATION_BYPASS_SECRET (sync trigger headers). None are ever
# echoed, printed, or included in any step output.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-BILLETTO-PREVIEW-SYNC to confirm: this triggers TWO real Billetto syncs against the Preview deployment and the shared database.'
        required: true

permissions:
  contents: read

concurrency:
  group: verify-billetto-preview
  cancel-in-progress: false

env:
  PREVIEW_BASE_URL: https://edm-git-claude-billetto-electronic-cph-pn5ggy-edm9.vercel.app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RUN-BILLETTO-PREVIEW-SYNC" ]; then
            echo "::error::Confirmation input did not match. Re-run and enter exactly: RUN-BILLETTO-PREVIEW-SYNC"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/billetto-electronic-cph-pn5ggy

      - name: Record the exact commit this run is verifying
        run: git rev-parse HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required secrets are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          missing=""
          [ -z "${DATABASE_URL:-}" ] && missing="${missing} DATABASE_URL"
          [ -z "${SYNC_TRIGGER_TOKEN:-}" ] && missing="${missing} SYNC_TRIGGER_TOKEN"
          [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ] && missing="${missing} VERCEL_AUTOMATION_BYPASS_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):${missing}"
            exit 1
          fi

      - name: Confirm the Preview deployment is actually reachable before touching anything
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          http_code=$(curl -sS --max-time 30 -o /tmp/preview-home.html -w '%{http_code}' \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${PREVIEW_BASE_URL}/")
          echo "Preview homepage HTTP status: ${http_code}"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Preview base URL ${PREVIEW_BASE_URL} did not return 2xx (got ${http_code}) -- stopping before any database read/write. Check that this URL matches the actual Vercel Preview for claude/billetto-electronic-cph-pn5ggy (Vercel's git-branch alias truncates/hashes very long branch names -- verify in the Vercel dashboard if this fails)."
            exit 1
          fi

      - name: Install dependencies (pg only needed, but npm ci matches repo convention)
        run: npm ci

      - name: Write read-only DB snapshot script
        run: |
          cat > snapshot.cjs << 'SCRIPT'
          const { Client } = require('pg');

          async function main(client) {
            await client.connect();
            await client.query('BEGIN');
            await client.query('SET LOCAL default_transaction_read_only = on');

            const label = process.env.SNAPSHOT_LABEL || 'SNAPSHOT';
            console.log(`\n========== ${label} ==========`);

            // Billetto (source under test) gets full detail. The other
            // three existing sources only need a compact regression
            // fingerprint -- full row dumps for them blew past this
            // workflow's retrievable log size and pushed the earlier
            // phases (BEFORE / AFTER SYNC#1) out of the log window
            // entirely. A count + an md5 checksum over ordered ids is
            // just as conclusive for "did anything change" as a full
            // dump, at a tiny fraction of the size.
            for (const sourceId of ['src-billetto', 'src-hangaren', 'src-culture-box', 'src-poolen']) {
              const src = await client.query(
                `SELECT id, last_successful_sync, last_attempted_sync, last_error, events_found, events_updated
                 FROM sources WHERE id = $1`,
                [sourceId],
              );
              console.log(`\n-- sources row (${sourceId}) --`);
              console.log(JSON.stringify(src.rows, null, 2));

              if (sourceId !== 'src-billetto') {
                const fp = await client.query(
                  `SELECT
                     (SELECT count(*)::int FROM discovery_queue WHERE source_id = $1) AS dq_count,
                     (SELECT md5(coalesce(string_agg(id::text, ',' ORDER BY id), '')) FROM discovery_queue WHERE source_id = $1) AS dq_md5,
                     (SELECT count(*)::int FROM events WHERE canonical_source_id = $1) AS ev_count,
                     (SELECT md5(coalesce(string_agg(id::text, ',' ORDER BY id), '')) FROM events WHERE canonical_source_id = $1) AS ev_md5,
                     (SELECT count(*)::int FROM source_event_links WHERE source_id = $1) AS links_count,
                     (SELECT md5(coalesce(string_agg(event_id::text, ',' ORDER BY event_id), '')) FROM source_event_links WHERE source_id = $1) AS links_md5`,
                  [sourceId],
                );
                console.log(`\n-- regression fingerprint (${sourceId}) --`);
                console.log(JSON.stringify(fp.rows, null, 2));
                continue;
              }

              const dq = await client.query(
                `SELECT id, probable_title, status, predicted_genre, genre_confidence, overall_confidence,
                        detected_lineup, missing_fields, suspected_duplicate_of_event_id, source_url, created_at
                 FROM discovery_queue WHERE source_id = $1 ORDER BY created_at`,
                [sourceId],
              );
              console.log(`\n-- discovery_queue (source_id=${sourceId}): ${dq.rows.length} rows --`);
              console.log(JSON.stringify(dq.rows, null, 2));

              const dqByConfidence = await client.query(
                `SELECT overall_confidence, count(*)::int AS n FROM discovery_queue WHERE source_id = $1 GROUP BY overall_confidence ORDER BY overall_confidence`,
                [sourceId],
              );
              console.log(`\n-- discovery_queue for src-billetto grouped by overall_confidence (medium ~= review_queue, low ~= hold) --`);
              console.log(JSON.stringify(dqByConfidence.rows, null, 2));

              const ev = await client.query(
                `SELECT id, title, venue_id, start_datetime, primary_genre, subgenres, genre_confidence,
                        confidence, published, manual_override, overridden_fields, official_event_url, ticket_url, created_at
                 FROM events WHERE canonical_source_id = $1 ORDER BY created_at`,
                [sourceId],
              );
              console.log(`\n-- events (canonical_source_id=${sourceId}): ${ev.rows.length} rows --`);
              console.log(JSON.stringify(ev.rows, null, 2));

              const links = await client.query(
                `SELECT event_id, source_id, source_url, role, first_seen_at
                 FROM source_event_links WHERE source_id = $1 ORDER BY first_seen_at`,
                [sourceId],
              );
              console.log(`\n-- source_event_links (source_id=${sourceId}): ${links.rows.length} rows --`);
              console.log(JSON.stringify(links.rows, null, 2));
            }

            // The specific overlap events -- did Billetto correctly attach
            // rather than duplicate?
            const overlap = await client.query(
              `SELECT id, title, canonical_source_id, official_event_url, ticket_url, other_source_urls
               FROM events WHERE id IN ('e-14bc847e', 'e-bb5fbae5')
               ORDER BY id`,
            );
            console.log(`\n-- known overlap events (Infected Mushroom / Arcanum Collective: POSSESSED) --`);
            console.log(JSON.stringify(overlap.rows, null, 2));

            const overlapLinks = await client.query(
              `SELECT event_id, source_id, source_url, role, first_seen_at
               FROM source_event_links WHERE event_id IN ('e-14bc847e', 'e-bb5fbae5') ORDER BY event_id, source_id`,
            );
            console.log(`\n-- source_event_links for the known overlap events --`);
            console.log(JSON.stringify(overlapLinks.rows, null, 2));

            // Global cross-checks: total counts by canonical source (did
            // anything outside Billetto move?), and the full set of
            // manually-overridden events (did any get clobbered?).
            const byCanonicalSource = await client.query(
              `SELECT canonical_source_id, count(*)::int AS n FROM events GROUP BY canonical_source_id ORDER BY canonical_source_id NULLS FIRST`,
            );
            console.log(`\n-- events grouped by canonical_source_id (global) --`);
            console.log(JSON.stringify(byCanonicalSource.rows, null, 2));

            const dqByStatus = await client.query(
              `SELECT source_id, status, count(*)::int AS n FROM discovery_queue GROUP BY source_id, status ORDER BY source_id NULLS FIRST, status`,
            );
            console.log(`\n-- discovery_queue grouped by source_id + status (global) --`);
            console.log(JSON.stringify(dqByStatus.rows, null, 2));

            const overridden = await client.query(
              `SELECT id, overridden_fields, manual_override, updated_at FROM events
               WHERE array_length(overridden_fields, 1) > 0 OR manual_override = true
               ORDER BY id`,
            );
            console.log(`\n-- events with any manual override (global): ${overridden.rows.length} rows --`);
            console.log(JSON.stringify(overridden.rows, null, 2));

            const totalEvents = await client.query(`SELECT count(*)::int AS n FROM events`);
            console.log(`\n-- total events (global): ${totalEvents.rows[0].n} --`);

            await client.query('COMMIT');
          }

          const client = new Client({ connectionString: process.env.DATABASE_URL });
          main(client)
            .catch((err) => {
              console.error('SNAPSHOT FAILED:', err.message);
              process.exitCode = 1;
            })
            .finally(() => client.end());
          SCRIPT

      - name: "PHASE 1 — BEFORE snapshot"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_LABEL: BEFORE (pre-sync)
        run: node snapshot.cjs

      - name: "PHASE 2 — trigger Billetto sync #1 against Preview"
        env:
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          response=$(curl -sS --max-time 180 -w '\n%{http_code}' \
            -X POST \
            -H "x-sync-token: ${SYNC_TRIGGER_TOKEN}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${PREVIEW_BASE_URL}/api/sync/billetto")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Sync #1 HTTP status: ${http_code}"
          echo "Sync #1 response body: ${body}"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Billetto sync #1 request failed with HTTP ${http_code} -- see response body above."
            exit 1
          fi

      - name: "PHASE 3 — AFTER first sync snapshot"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_LABEL: AFTER SYNC #1
        run: node snapshot.cjs

      - name: "PHASE 4 — trigger Billetto sync #2 against Preview (idempotency check)"
        env:
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          response=$(curl -sS --max-time 180 -w '\n%{http_code}' \
            -X POST \
            -H "x-sync-token: ${SYNC_TRIGGER_TOKEN}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${PREVIEW_BASE_URL}/api/sync/billetto")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Sync #2 HTTP status: ${http_code}"
          echo "Sync #2 response body: ${body}"
          echo "A healthy re-run should report 'created: 0' -- everything already exists as either a published event (matched via source_event_links) or a pending discovery_queue row (matched via source_url), so nothing new should be created the second time."
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Billetto sync #2 request failed with HTTP ${http_code} -- see response body above."
            exit 1
          fi

      - name: "PHASE 5 — AFTER second sync snapshot (idempotency evidence)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_LABEL: AFTER SYNC #2 (idempotency check)
        run: node snapshot.cjs

      - name: Remove local scratch script
        if: always()
        run: rm -f snapshot.cjs
