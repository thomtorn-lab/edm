name: Sync venue copy sanitization (once)

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage HTML
        run: |
          curl -sSL -D headers.txt -H "Cache-Control: no-cache" -H "Pragma: no-cache" -o home.html "https://electroniccph.com/?_cb=$(date +%s)"
          wc -c home.html
          echo "--- response headers ---"
          cat headers.txt

      - name: Confirm the new secondary-strong hierarchy class shipped on the event list
        run: |
          echo "--- text-text-secondary-strong occurrences (venue name / lineup / action links) ---"
          if grep -q 'text-text-secondary-strong' home.html; then
            echo "OK: text-text-secondary-strong is present in the shipped markup"
          else
            echo "FAIL: text-text-secondary-strong not found"
            exit 1
          fi

      - name: Locate and fetch the compiled CSS bundle
        run: |
          CSS_PATH=$(grep -oE 'href="[^"]*\.css[^"]*"' home.html | head -1 | sed -E 's/href="([^"]*)"/\1/')
          echo "CSS_PATH=$CSS_PATH"
          if [ -z "$CSS_PATH" ]; then
            echo "FAIL: could not find a compiled CSS link in the homepage HTML"
            exit 1
          fi
          case "$CSS_PATH" in
            http*) URL="$CSS_PATH" ;;
            *) URL="https://electroniccph.com${CSS_PATH}" ;;
          esac
          curl -sSL -o bundle.css "$URL"
          wc -c bundle.css

      - name: Confirm the new --text-secondary-strong token exists and sits between primary and tertiary
        run: |
          echo "--- --text-secondary-strong definition ---"
          if grep -o -- '--text-secondary-strong:#cec8dc' bundle.css; then
            echo "OK: token defined with expected value"
          else
            echo "FAIL: --text-secondary-strong token not found with expected value"
            exit 1
          fi
          echo "--- --color-text-secondary-strong registered as a Tailwind color ---"
          if grep -o -- '--color-text-secondary-strong:var(--text-secondary-strong)' bundle.css; then
            echo "OK: color token registered"
          else
            echo "FAIL: --color-text-secondary-strong not registered"
            exit 1
          fi
          echo "--- existing tokens unchanged ---"
          grep -o -- '--text-primary:#f3ede4' bundle.css || echo "note: not matched verbatim, may be reformatted"
          grep -o -- '--text-secondary:#a49ead' bundle.css || echo "note: not matched verbatim, may be reformatted"
          grep -o -- '--text-tertiary:#847f90' bundle.css || echo "note: not matched verbatim, may be reformatted"
