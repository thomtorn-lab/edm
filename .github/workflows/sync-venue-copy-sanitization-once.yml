name: Sync venue copy sanitization (once)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run read-only event-status audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/auditEventStatus.mjs
