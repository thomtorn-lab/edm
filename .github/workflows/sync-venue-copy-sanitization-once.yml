name: Sync venue copy sanitization (once)

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage HTML
        run: |
          curl -sS -o home.html "https://electroniccph.com/"
          echo "--- bytes fetched ---"
          wc -c home.html

      - name: Confirm accent-select / search-field hooks are in the shipped markup
        run: |
          echo "--- accent-select occurrences ---"
          grep -o 'accent-select' home.html | sort | uniq -c
          echo "--- search-field occurrences ---"
          grep -o 'search-field' home.html | sort | uniq -c
          echo "--- confirm the old purple search focus class is gone ---"
          if grep -q 'focus:border-accent' home.html; then
            echo "FAIL: focus:border-accent still present on search input"
            exit 1
          else
            echo "OK: focus:border-accent not present"
          fi
          echo "--- confirm neutral focus border class present on search ---"
          grep -o 'focus:border-text-secondary' home.html | sort | uniq -c

      - name: Locate and fetch the compiled CSS bundle
        run: |
          CSS_PATH=$(grep -oE '/_next/static/css/[a-zA-Z0-9_.-]+\.css' home.html | head -1)
          echo "CSS_PATH=$CSS_PATH"
          if [ -z "$CSS_PATH" ]; then
            echo "FAIL: could not find a compiled CSS link in the homepage HTML"
            exit 1
          fi
          curl -sS -o bundle.css "https://electroniccph.com${CSS_PATH}"
          wc -c bundle.css

      - name: Confirm the neutral focus-visible override rule shipped in CSS
        run: |
          echo "--- searching for .accent-select:focus-visible rule ---"
          if grep -o '\.accent-select:focus-visible[^}]*}' bundle.css; then
            echo "OK: found .accent-select:focus-visible rule"
          else
            echo "FAIL: .accent-select:focus-visible rule not found in shipped CSS"
            exit 1
          fi
          echo "--- searching for .search-field:focus-visible rule ---"
          if grep -o '\.search-field:focus-visible[^}]*}' bundle.css; then
            echo "OK: found .search-field:focus-visible rule"
          else
            echo "FAIL: .search-field:focus-visible rule not found in shipped CSS"
            exit 1
          fi
          echo "--- confirm the base sitewide purple focus-visible rule is still present (unmodified for everything else) ---"
          grep -o '.focus-visible{outline:2px solid[^}]*}' bundle.css || grep -o ':focus-visible{outline:2px solid[^}]*}' bundle.css || echo "note: base rule pattern not matched verbatim (may be reformatted by minifier) — not a failure on its own"
