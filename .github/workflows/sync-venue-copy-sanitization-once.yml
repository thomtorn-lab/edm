name: Sync venue copy sanitization (once)

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch top-level pages
        run: |
          curl -sSL -H "Cache-Control: no-cache" -H "Pragma: no-cache" -o about.html "https://electroniccph.com/about?_cb=$(date +%s)"
          curl -sSL -H "Cache-Control: no-cache" -H "Pragma: no-cache" -o festivals.html "https://electroniccph.com/festivals?_cb=$(date +%s)"
          curl -sSL -H "Cache-Control: no-cache" -H "Pragma: no-cache" -o venues.html "https://electroniccph.com/venues?_cb=$(date +%s)"
          wc -c about.html festivals.html venues.html

      - name: Confirm top-level eyebrows are gone
        run: |
          if grep -qE '<p[^>]*>\s*ABOUT\s*</p>' about.html; then
            echo "FAIL: About eyebrow still present"; exit 1
          fi
          echo "OK: no About eyebrow"
          if grep -qE '<p[^>]*>\s*FESTIVALS\s*</p>' festivals.html; then
            echo "FAIL: Festivals eyebrow still present"; exit 1
          fi
          echo "OK: no Festivals eyebrow"
          if grep -qE '<p[^>]*>\s*VENUES\s*</p>' venues.html; then
            echo "FAIL: Venues eyebrow still present"; exit 1
          fi
          echo "OK: no Venues eyebrow"

      - name: Confirm the H1 itself carries the accent purple on all three top-level pages
        run: |
          for f in about.html festivals.html venues.html; do
            if grep -qoE '<h1[^>]*text-accent[^>]*>' "$f"; then
              echo "OK: $f H1 has text-accent"
            else
              echo "FAIL: $f H1 does not have text-accent"
              exit 1
            fi
          done

      - name: Confirm the venue-name link arrow affordance shipped on /venues
        run: |
          grep -o 'inline-flex cursor-pointer items-baseline[^"]*' venues.html | head -1
          if grep -q 'inline-flex cursor-pointer items-baseline' venues.html; then
            echo "OK: venue-name link arrow wrapper class present"
          else
            echo "FAIL: venue-name link arrow wrapper class not found"
            exit 1
          fi
          grep -c '&#8594;\|→' venues.html || true

      - name: Confirm festival entries link out, not to the removed detail route
        run: |
          if grep -oE 'href="/festivals/[a-z0-9-]+"' festivals.html; then
            echo "FAIL: found an internal /festivals/[slug] link — detail route should be gone from entries"
            exit 1
          else
            echo "OK: no internal /festivals/[slug] links found in entries"
          fi
          echo "--- sample festival entry link ---"
          grep -oE '<a href="https://[^"]*"[^>]*target="_blank"[^>]*>[^<]*↗' festivals.html | head -3

      - name: Confirm the old festival-detail route redirects instead of 404ing
        run: |
          RAW_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://electroniccph.com/festivals/tomorrowland")
          echo "raw (no-follow) status=$RAW_CODE"
          if [ "$RAW_CODE" != "307" ] && [ "$RAW_CODE" != "308" ]; then
            echo "FAIL: expected a redirect (307/308) from the old festival-detail URL, got $RAW_CODE"
            exit 1
          fi
          LOCATION=$(curl -sS -o /dev/null -D - "https://electroniccph.com/festivals/tomorrowland" | grep -i '^location:' | tr -d '\r')
          echo "$LOCATION"
          echo "$LOCATION" | grep -q '/festivals' || { echo "FAIL: redirect did not point to /festivals"; exit 1; }
          FOLLOWED_CODE=$(curl -sSL -o /dev/null -w "%{http_code}" "https://electroniccph.com/festivals/tomorrowland")
          echo "followed status=$FOLLOWED_CODE"
          if [ "$FOLLOWED_CODE" != "200" ]; then
            echo "FAIL: expected 200 after following the redirect, got $FOLLOWED_CODE"
            exit 1
          fi
          echo "OK: old festival-detail URL redirects to /festivals with a real 200 there, no broken link"
