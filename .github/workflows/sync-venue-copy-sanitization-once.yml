name: Sync venue copy sanitization (once)

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage HTML
        run: |
          curl -sSL -D headers.txt -H "Cache-Control: no-cache" -H "Pragma: no-cache" -o home.html "https://electroniccph.com/?_cb=$(date +%s)"
          wc -c home.html
          echo "--- response headers ---"
          cat headers.txt

      - name: Confirm DATE CHANGED / TIME CHANGED are gone from the homepage listing
        run: |
          if grep -qi 'date changed' home.html; then
            echo "FAIL: 'Date changed' still present in homepage markup"
            exit 1
          else
            echo "OK: 'Date changed' not present"
          fi
          if grep -qi 'time changed' home.html; then
            echo "FAIL: 'Time changed' still present in homepage markup"
            exit 1
          else
            echo "OK: 'Time changed' not present"
          fi

      - name: Confirm FREE badge still present somewhere on the homepage (no regression)
        run: |
          if grep -q '>Free<' home.html; then
            echo "OK: at least one FREE badge present"
          else
            echo "NOTE: no FREE badge found on homepage right now (not necessarily a regression, depends on current data) — see MCR-T/detail checks"
          fi

      - name: Fetch MCR-T event detail page
        run: |
          curl -sSL -D mcrt-headers.txt -H "Cache-Control: no-cache" -H "Pragma: no-cache" -o mcrt.html "https://electroniccph.com/events/mcr-t-e-9434dd8e?_cb=$(date +%s)"
          wc -c mcrt.html
          echo "--- response headers ---"
          cat mcrt-headers.txt
          echo "--- title/date area ---"
          grep -o '<h1[^>]*>[^<]*</h1>' mcrt.html || true

      - name: Confirm MCR-T shows no public lifecycle badge and no DATE/TIME CHANGED text
        run: |
          if grep -qi 'date changed' mcrt.html; then
            echo "FAIL: MCR-T page still shows 'Date changed'"
            exit 1
          else
            echo "OK: MCR-T shows no 'Date changed'"
          fi
          if grep -qi 'time changed' mcrt.html; then
            echo "FAIL: MCR-T page still shows 'Time changed'"
            exit 1
          else
            echo "OK: MCR-T shows no 'Time changed'"
          fi
          if grep -qi '>Cancelled<' mcrt.html || grep -qi '>Sold out<' mcrt.html; then
            echo "FAIL: MCR-T unexpectedly shows a Cancelled/Sold out badge"
            exit 1
          else
            echo "OK: MCR-T shows no Cancelled/Sold out badge"
          fi
          echo "--- MCR-T date/time text (manual eyeball check, expect Nov 20 2026 22:00) ---"
          grep -o '20.*November.*2026\|November 20\|20 Nov[a-z]*' mcrt.html || true

      - name: Diagnostics — inspect what the homepage actually returned
        run: |
          echo "--- <title> ---"
          grep -o '<title>[^<]*</title>' home.html || true
          echo "--- occurrences of a few known-stable classes ---"
          echo "text-text-secondary-strong: $(grep -o 'text-text-secondary-strong' home.html | wc -l)"
          echo "text-text-tertiary: $(grep -o 'text-text-tertiary' home.html | wc -l)"
          echo "border-b border-border: $(grep -o 'border-b border-border' home.html | wc -l)"
          echo "/events/ links: $(grep -o 'href="/events/[a-z0-9-]*"' home.html | wc -l)"
          echo "--- first /events/ href sample ---"
          grep -o 'href="/events/[a-z0-9-]*"' home.html | head -5 || true

      - name: Confirm the event list/detail structural markers still render (no gross regression)
        run: |
          if grep -q 'text-text-secondary-strong' home.html; then
            echo "OK: event-row secondary-strong hierarchy markup present"
          else
            echo "FAIL: expected event-row markup not found — possible rendering regression"
            exit 1
          fi
          if grep -qi 'MCR-T' mcrt.html; then
            echo "OK: MCR-T detail page renders its own title"
          else
            echo "FAIL: MCR-T title not found on its own detail page"
            exit 1
          fi

      - name: Locate and fetch the compiled CSS bundle
        run: |
          CSS_PATH=$(grep -oE 'href="[^"]*\.css[^"]*"' home.html | head -1 | sed -E 's/href="([^"]*)"/\1/')
          echo "CSS_PATH=$CSS_PATH"
          if [ -z "$CSS_PATH" ]; then
            echo "FAIL: could not find a compiled CSS link in the homepage HTML"
            exit 1
          fi
          case "$CSS_PATH" in
            http*) URL="$CSS_PATH" ;;
            *) URL="https://electroniccph.com${CSS_PATH}" ;;
          esac
          curl -sSL -o bundle.css "$URL"
          wc -c bundle.css

      - name: Confirm CANCELLED / SOLD OUT styling assets are present in the shipped CSS (without fabricating live data)
        run: |
          echo "--- status-bad (Cancelled) utilities ---"
          grep -o -- '\.text-status-bad{[^}]*}' bundle.css || echo "note: class may be minified/renamed, checking raw token instead"
          grep -o -- '--status-bad:#c97272' bundle.css && echo "OK: --status-bad token present" || echo "FAIL: --status-bad token missing"
          echo "--- neutral/secondary-strong (Sold out) utilities ---"
          grep -o -- '--text-secondary-strong:#cec8dc' bundle.css && echo "OK: --text-secondary-strong token present" || echo "FAIL: --text-secondary-strong token missing"
          grep -o -- '\.border-border-strong{[^}]*}' bundle.css || echo "note: border-strong utility may be minified, token check below is authoritative"
          grep -o -- '--border-strong:rgba(240,236,248,0.16)' bundle.css || grep -o -- '--border-strong:rgba(240, 236, 248, 0.16)' bundle.css || echo "note: token spacing may differ, non-fatal"
