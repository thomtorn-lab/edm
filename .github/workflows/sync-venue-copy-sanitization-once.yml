name: Sync venue copy sanitization (once)

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch homepage HTML
        run: |
          curl -sSL -o home.html "https://electroniccph.com/"
          wc -c home.html

      - name: Confirm accent-select / search-field hooks are still in the shipped markup
        run: |
          grep -o 'accent-select' home.html | sort | uniq -c
          grep -o 'search-field' home.html | sort | uniq -c

      - name: Locate and fetch the compiled CSS bundle
        run: |
          CSS_PATH=$(grep -oE 'href="[^"]*\.css[^"]*"' home.html | head -1 | sed -E 's/href="([^"]*)"/\1/')
          echo "CSS_PATH=$CSS_PATH"
          if [ -z "$CSS_PATH" ]; then
            echo "FAIL: could not find a compiled CSS link in the homepage HTML"
            exit 1
          fi
          case "$CSS_PATH" in
            http*) URL="$CSS_PATH" ;;
            *) URL="https://electroniccph.com${CSS_PATH}" ;;
          esac
          curl -sSL -o bundle.css "$URL"
          wc -c bundle.css

      - name: Confirm the outer ring is fully suppressed for these three controls
        run: |
          echo "--- outline:none rule for accent-select/search-field ---"
          if grep -o '\.accent-select:focus-visible[^{]*\.search-field:focus-visible{outline:none}' bundle.css; then
            echo "OK: outline:none rule found"
          else
            echo "FAIL: outline:none rule not found in shipped CSS"
            exit 1
          fi
          echo "--- neutral internal border-color rule (inactive selects + search) ---"
          if grep -o '\.accent-select:focus-visible:not(\.border-accent)[^{]*\.search-field:focus-visible{border-color:var(--text-secondary)}' bundle.css; then
            echo "OK: neutral border-color rule found"
          else
            echo "FAIL: neutral border-color rule not found"
            exit 1
          fi
          echo "--- brighter-purple internal border-color rule (active selects) ---"
          if grep -o '\.accent-select\.border-accent:focus-visible{border-color:var(--accent-strong)}' bundle.css; then
            echo "OK: active border-color rule found"
          else
            echo "FAIL: active border-color rule not found"
            exit 1
          fi
          echo "--- confirm the sitewide focus-visible outline rule is unmodified for everything else ---"
          grep -o ':focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}' bundle.css || echo "note: base rule pattern not matched verbatim (may be reformatted by minifier) — not a failure on its own"
          echo "--- confirm the old outline-color override (previous round's approach) is gone ---"
          if grep -q 'outline-color:var(--text-secondary)' bundle.css; then
            echo "FAIL: old outline-color override still present — outer ring not actually removed"
            exit 1
          else
            echo "OK: old outline-color override is gone"
          fi
