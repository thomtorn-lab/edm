name: TEMP - Sync Culture Box Source Registry

# ONE-OFF, temporary workflow: corrects the stale `adapter` field on the
# Production `src-culture-box` sources row (currently "first-party-json";
# code defines "culture-box-html" in src/lib/data/sources.ts). Reuses the
# exact same static-configuration upsert logic as the full production
# bootstrap (seedSourcesProduction in src/db/referenceData.ts), scoped to
# this one source id only via src/db/syncSourceRegistry.ts — the same
# scoped mechanism already used and verified for the equivalent
# src-billetto correction.
#
# Scope, deliberately narrow:
#   - Touches ONLY the src-culture-box row in the `sources` table, and only
#     its static configuration fields (adapter, trustLevel, autoPublish,
#     syncFrequency, roles, baseUrl, sourceType, sourceName, active,
#     integrationNote) — see src/lib/sourceRegistry.ts::toProductionSourceRow.
#   - Never touches sync-health fields (lastSuccessfulSync/
#     lastAttemptedSync/lastError/eventsFound/eventsUpdated) — those stay
#     whatever the real sync history already made them.
#   - Never touches venues, any other source's row, events,
#     discovery_queue, or source_event_links.
#   - Never runs a schema migration.
#
# Deliberately temporary: added, run once, then removed — matching this
# repo's own established pattern for a genuinely one-time Production
# action (see git history: the src-billetto equivalent of this workflow,
# and the earlier add/remove pair for the Billetto sync verification
# workflow).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SYNC-CULTURE-BOX-REGISTRY to confirm: this updates ONLY the static configuration fields on the Production src-culture-box sources row to match src/lib/data/sources.ts. No other row or table is touched.'
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "SYNC-CULTURE-BOX-REGISTRY" ]; then
            echo "::error::Confirmation input did not match. Re-run and enter exactly: SYNC-CULTURE-BOX-REGISTRY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the sync script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Sync src-culture-box static configuration only
        run: node --env-file=.env.local --import tsx src/db/syncSourceRegistry.ts src-culture-box

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
