name: QA Branch CI (isolated, no database)
on:
  push:
    branches:
      - feature/qa-export-status-v1-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/qa-export-status-v1-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck (no build)
        run: npx tsc --noEmit
      - name: QA unit tests
        run: npx vitest run src/lib/qaStatus.test.ts src/lib/qaSnapshotEnrichment.test.ts
      - name: Existing relevant regression tests
        run: npx vitest run src/lib/dedup.test.ts src/lib/sourceHealth.test.ts src/db/readOnlyTransaction.test.ts
      - name: Validate GitHub workflow YAML and DST schedule
        run: node --import tsx src/lib/qaWorkflowValidation.test.ts
