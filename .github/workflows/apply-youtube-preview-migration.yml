name: Apply YouTube Preview Migration

# One-time, deliberately temporary workflow (YouTube Artist Preview V1
# post-merge migration, 2026-09-25). Mirrors this repo's established
# one-time-correction pattern (see vega-room-model-migration.yml): added,
# run once, then a candidate for removal. Runs the exact SAME production
# database migration mechanism this repo already uses for every schema
# change — `npm run db:migrate` (drizzle-kit migrate) — against the
# DATABASE_URL secret. Not a custom script: drizzle-kit's own migrate()
# only ever applies migration files newer than the last one recorded in
# `drizzle.__drizzle_migrations` (see src/db/inspectSource.ts's
# `migration-status` mode, which reproduces that exact comparison
# read-only, for confirming beforehand exactly what this would apply).
#
# Secrets used: DATABASE_URL only. Never echoed, printed, or logged.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-YOUTUBE-PREVIEW-MIGRATION to confirm running `npm run db:migrate` against Production.'
        required: true

permissions:
  contents: read

concurrency:
  group: apply-youtube-preview-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation token
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY-YOUTUBE-PREVIEW-MIGRATION" ]; then
            echo "::error::--confirm must be exactly APPLY-YOUTUBE-PREVIEW-MIGRATION to run this workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for drizzle-kit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Run db:migrate
        run: npm run db:migrate

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
