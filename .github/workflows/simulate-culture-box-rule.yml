name: Simulate Culture Box High-Confidence Rule (read-only, diagnostic)

# ONE-OFF, manual, confirmation-gated, strictly READ-ONLY diagnostic.
# Phase 2 Part B of the Culture Box publishing diagnosis: simulates a
# PROPOSED (not implemented) narrowly-scoped high-confidence rule against
# the 32 real src-culture-box discovery_queue rows and their already-cached
# Discogs per-artist enrichment evidence (artist_genre_cache). No writes
# anywhere in this file (BEGIN; SET LOCAL default_transaction_read_only =
# on; SELECT; ROLLBACK). Mirrors inspect-culture-box-publishing.yml's own
# precedent from Phase 1 of the same diagnosis. Intended to be removed once
# the simulation output is captured.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SIMULATE-CULTURE-BOX-RULE to confirm: this only runs read-only SELECTs against the shared Preview/Production database.'
        required: true

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "SIMULATE-CULTURE-BOX-RULE" ]; then
            echo "::error::Confirmation input did not match. Re-run and enter exactly: SIMULATE-CULTURE-BOX-RULE"
            exit 1
          fi

      - name: Verify required secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -u
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing required repository secret: DATABASE_URL"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pg
        run: npm install pg@8

      - name: Read-only simulation of the proposed Culture Box rule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > simulate.cjs << 'SCRIPT'
          const { Client } = require('pg');

          // ---- Replicated (read-only, no app import) from src/lib/enrichment/genreEnrichment.ts ----
          const PLACEHOLDER = new Set(['tba', 'tbd', 'tbc']);
          function isPlaceholder(name) {
            return PLACEHOLDER.has(name.trim().toLowerCase().replace(/\./g, ''));
          }
          function cleanArtistDisplayName(name) {
            let result = name.trim();
            let match;
            while ((match = result.match(/\s*[([][^()[\]]*[)\]]$/))) {
              const stripped = result.slice(0, match.index).trim();
              if (stripped.length === 0) break;
              result = stripped;
            }
            return result;
          }
          function normalizeArtistName(name) {
            return name.trim().toLowerCase().replace(/\s+/g, ' ');
          }
          function normKey(raw) {
            return normalizeArtistName(cleanArtistDisplayName(raw));
          }
          const NON_ELECTRONIC_TOP_LEVEL = new Set([
            'rock', 'pop', 'hip hop', 'folk, world, & country', 'jazz', 'classical',
            'reggae', 'funk / soul', 'blues', 'latin', 'stage & screen', 'childrens',
            "children's", 'brass & military', 'non-music',
          ]);
          function hasNonElectronicTag(releasesExamined) {
            if (!Array.isArray(releasesExamined)) return false;
            return releasesExamined.some((r) =>
              Array.isArray(r.genres) && r.genres.some((g) => NON_ELECTRONIC_TOP_LEVEL.has(String(g).toLowerCase())),
            );
          }

          // ---- Proposed rule (Phase 2 Part B, NOT implemented in app code) ----
          function evaluateProposedRule(lineup, cacheByKey) {
            const nonPlaceholder = lineup.filter((n) => !isPlaceholder(n));
            const totalArtists = nonPlaceholder.length;
            const perArtist = nonPlaceholder.map((raw) => {
              const key = normKey(raw);
              const entry = cacheByKey.get(key) || null;
              return { raw, key, entry };
            });
            const resolved = perArtist.filter(
              (a) =>
                a.entry &&
                a.entry.lookup_status === 'found' &&
                a.entry.identity_confidence === 'medium' &&
                a.entry.proposed_genre,
            );
            const resolvedCount = resolved.length;
            const coverage = totalArtists > 0 ? resolvedCount / totalArtists : 0;
            const distinctGenres = new Set(resolved.map((a) => a.entry.proposed_genre));
            const unanimous = distinctGenres.size === 1;
            const genre = unanimous ? [...distinctGenres][0] : null;
            const isGeneric = genre === 'electronic-other';
            const anyConflictingEvidence = resolved.some((a) => a.entry.evidence && a.entry.evidence.conflicting === true);
            const anyNonElectronicTag = resolved.some((a) => hasNonElectronicTag(a.entry.evidence && a.entry.evidence.releasesExamined));

            const passes =
              resolvedCount >= 2 &&
              coverage >= 0.67 &&
              unanimous &&
              genre &&
              !isGeneric &&
              !anyConflictingEvidence &&
              !anyNonElectronicTag;

            return {
              totalArtists,
              resolvedCount,
              coverage: Math.round(coverage * 100) / 100,
              unanimous,
              genre,
              isGeneric,
              anyConflictingEvidence,
              anyNonElectronicTag,
              passes,
              perArtist: perArtist.map((a) => ({
                raw: a.raw,
                found: !!a.entry,
                lookupStatus: a.entry ? a.entry.lookup_status : null,
                identityConfidence: a.entry ? a.entry.identity_confidence : null,
                proposedGenre: a.entry ? a.entry.proposed_genre : null,
              })),
            };
          }

          async function main(client) {
            await client.connect();
            await client.query('BEGIN');
            await client.query('SET LOCAL default_transaction_read_only = on');

            const dq = await client.query(
              `SELECT id, probable_title, detected_lineup, predicted_genre, genre_confidence, overall_confidence
               FROM discovery_queue
               WHERE source_id = 'src-culture-box' AND status = 'pending'
               ORDER BY probable_start`,
            );

            const cache = await client.query(
              `SELECT artist_name_normalized, lookup_status, proposed_genre, genre_confidence,
                      identity_confidence, discogs_artist_id, evidence
               FROM artist_genre_cache`,
            );
            const cacheByKey = new Map(cache.rows.map((r) => [r.artist_name_normalized, r]));
            console.log(`\n-- artist_genre_cache size: ${cache.rows.length} rows --`);

            let autoPublish = 0, reviewQueue = 0, hold = 0;
            const newlyAutoPublish = [];
            const results = [];

            for (const row of dq.rows) {
              const sim = evaluateProposedRule(row.detected_lineup, cacheByKey);
              const currentlyAuto = false; // none of these 32 rows are auto_publish today (confirmed Phase 1)
              const wasReviewQueue = row.overall_confidence === 'medium';
              if (sim.passes) {
                autoPublish++;
                newlyAutoPublish.push({ id: row.id, title: row.probable_title, genre: sim.genre, coverage: sim.coverage, resolvedCount: sim.resolvedCount, totalArtists: sim.totalArtists });
              } else if (wasReviewQueue) {
                reviewQueue++;
              } else {
                hold++;
              }
              results.push({ id: row.id, title: row.probable_title, current_genre_confidence: row.genre_confidence, current_overall_confidence: row.overall_confidence, sim });
            }

            console.log('\n-- per-row simulation detail --');
            console.log(JSON.stringify(results, null, 2));

            console.log('\n-- SUMMARY --');
            console.log(JSON.stringify({ totalRows: dq.rows.length, wouldAutoPublish: autoPublish, wouldStayReviewQueue: reviewQueue, wouldStayHold: hold }, null, 2));

            console.log('\n-- titles that would NEWLY auto-publish under the proposed rule --');
            console.log(JSON.stringify(newlyAutoPublish, null, 2));

            await client.query('COMMIT');
          }

          const client = new Client({ connectionString: process.env.DATABASE_URL });
          main(client)
            .catch((err) => {
              console.error('QUERY FAILED:', err.message);
              process.exitCode = 1;
            })
            .finally(() => client.end());
          SCRIPT
          node simulate.cjs

      - name: Remove local scratch script
        if: always()
        run: rm -f simulate.cjs
