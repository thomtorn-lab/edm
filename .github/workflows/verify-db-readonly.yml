name: Verify Database (Read-Only)

# One-off, manual, read-only database health check — created to verify the
# shared Supabase database after an accidental `npm run db:seed:dev`
# attempt from an agent sandbox that could not actually reach the database
# (every connection attempt timed out at the TCP layer before reaching
# Postgres). GitHub-hosted runners have normal network access, so this is
# the authoritative way to confirm the database's real state.
#
# Strictly read-only:
#   - workflow_dispatch only — never runs on push/PR/schedule.
#   - No migrations, no seed script, no application sync, no deployment.
#   - The verification script opens exactly one dedicated pg connection,
#     opens a genuinely read-only transaction (BEGIN READ ONLY, asserted via
#     SHOW transaction_read_only — transaction-scoped only, never
#     ALTER ROLE/ALTER DATABASE, never persisted), issues only SELECT
#     statements, always ROLLBACKs, then explicitly closes the connection.
#   - DATABASE_URL is read only into this step's environment — never
#     written to a file, never echoed, never logged.
#
# Since 2026-10-25 the check lives in src/db/verifyDbReadonlyCli.ts (rules
# in src/db/verifyDbReadonly.ts, unit-tested) instead of an inline script,
# and compares against the current code registries (src/lib/data) rather
# than lists hardcoded in 2026-08 — those made every later source onboarding
# and every venue created in admin look like contamination. Result classes:
#   - CONFIRMED CONTAMINATION (fails the run): seedDev fixture events or
#     discovery items (by id, or by exact title+start+venue / title+source),
#     or seedDev's staged source sync-health values.
#   - NEEDS INVESTIGATION (warning, run stays green): a source not in the code
#     registry, a registry source missing from the database, a venue named
#     after a place ("Copenhagen", "TBA", ...) rather than a venue.
#   - NORMAL ACTIVITY (information): venues created in admin, recent rows.
# Still uses the privileged DATABASE_URL; moving it to the shared read-only
# report_ro role is a separate task.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run read-only verification
        # Rules: src/db/verifyDbReadonly.ts (unit-tested). Fails only on confirmed
        # seedDev fixture data or a script error; findings that need investigation
        # are printed as warnings, normal activity as information. DATABASE_URL is
        # passed through this step's environment only — never written to a file,
        # never echoed.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx src/db/verifyDbReadonlyCli.ts
