name: VEGA Room Model Migration

# One-time, deliberately temporary workflow (generalized sub-venue model,
# 2026-09-06 — VEGA venue model cleanup follow-up). Mirrors this repo's
# established one-time-correction pattern: added, run once, then removed.
# Runs src/db/vegaRoomModelMigration.ts, which moves v-vega's Production
# "Store VEGA"/"Lille VEGA" strings from `aliases` to the new `rooms` field
# via the existing human-gated updateVenueAliases()/updateVenueRooms() write
# paths — no migration script here itself (the schema migration
# 0010_venue_room_model.sql is applied separately via `npm run db:migrate`),
# no event/source writes, no destructive action.
#
# Secrets used: DATABASE_URL only. Never echoed, printed, or logged.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '"plan" (read-only, default) or "apply" (writes)'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      confirm:
        description: 'apply mode only: type VEGA-ROOM-MODEL-MIGRATION-2026-09-06 to confirm the writes.'
        required: false

permissions:
  contents: read

concurrency:
  group: vega-room-model-migration
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Run VEGA room model migration
        run: |
          set -u
          args=(--mode="${{ inputs.mode }}")
          [ -n "${{ inputs.confirm }}" ] && args+=(--confirm="${{ inputs.confirm }}")
          node --env-file=.env.local --import tsx src/db/vegaRoomModelMigration.ts "${args[@]}"

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
