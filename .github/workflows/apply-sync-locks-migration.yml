name: Apply sync_locks Migration (Migrate Only)

# One-off, manual application of migration 0004 (creates the sync_locks
# table backing the new per-source sync concurrency lease — see
# src/db/sync.ts's acquireSyncLock/releaseSyncLock doc comment). Runs ONLY
# `npm run db:migrate` (drizzle-kit migrate), never the reference-data
# seed/bootstrap scripts that prepare-production-db.yml also runs — this
# workflow exists specifically to avoid re-running that seed step, which
# isn't needed here and touches more than this change requires.
#
# drizzle-kit migrate tracks applied migrations in its own table and is a
# no-op for anything already applied, so this is safe to run against the
# shared Preview/Production database at any point.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-SYNC-LOCKS-MIGRATION to confirm you want to run drizzle-kit migrate against the DATABASE_URL secret.'
        required: true

permissions:
  contents: read

concurrency:
  group: prepare-production-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY-SYNC-LOCKS-MIGRATION" ]; then
            echo "::error::Confirmation input did not match. Re-run this workflow and enter exactly: APPLY-SYNC-LOCKS-MIGRATION"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the db scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
