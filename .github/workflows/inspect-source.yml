name: Inspect Source

# Permanent, parameterized, READ-ONLY source diagnostic workflow (source
# onboarding factory, Phase 2.1 — see SOURCE_ONBOARDING.md). Replaces the
# old pattern of hand-writing a brand-new one-off workflow every time a
# source needed inspecting (verify-db-readonly.yml, monitor-source-health's
# bespoke inline script, verify-discogs-reachability.yml). This workflow is
# never deleted and never source-specific — it wraps
# src/db/inspectSource.ts, which does the actual work.
#
# Safety, unchanged from the one-off workflows it replaces:
#   - workflow_dispatch only — never runs on push/PR/schedule.
#   - Every DB-touching mode opens one dedicated read-only Postgres
#     transaction (BEGIN READ ONLY, asserted via SHOW transaction_read_only;
#     ...; ROLLBACK) — see src/db/inspectSource.ts's withReadOnlyTx.
#   - No migration, seed, sync, or write path is ever reachable from here.
#   - DATABASE_URL is read only into the step environment via .env.local,
#     removed at the end of the run — never echoed or logged.
#   - "reachability" mode never prints a credential value, only whether one
#     was configured and the HTTP status a request using it returned.
#
# One-time setup: repository secret DATABASE_URL. For --with-credentials
# reachability checks against src-billetto, also BILLETTO_ACCESS_KEY_ID /
# BILLETTO_ACCESS_KEY_SECRET (already required for that source's real sync
# to work at all). For --with-credentials --source=src-youtube (YouTube
# Data API v3, used only for the Artist Preview feasibility audit — not a
# registered sync source), also YOUTUBE_API_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Diagnostic mode"
        required: true
        type: choice
        options:
          - inventory
          - health
          - discovery-queue
          - source-links
          - lock-status
          - dedup-simulate
          - reachability
          - snapshot
          - venues
          - venue-events
          - discovery-queue-venues
          - venue-blocks
          - event-integrity
          - text-leakage-audit
          - cancellation-audit
          - link-role-audit
          - db-integrity
          - adapter-dry-run
          - admin-queue-audit
          - ignore-persistence-audit
          - genre-taxonomy-audit
          - youtube-preview-dry-run
          - youtube-preview-backfill-plan
          - youtube-preview-backlog-projection
          - youtube-preview-cache-row
          - migration-status
          - artist-genre-cache
          - review-discogs-measure
          - artist-identity-audit
      source_id:
        description: 'Source id, e.g. "src-hangaren" (required for every mode except inventory/lock-status/reachability/db-integrity/venue-blocks/event-integrity/text-leakage-audit/cancellation-audit/link-role-audit/admin-queue-audit/ignore-persistence-audit/genre-taxonomy-audit with no source scoping; must match src-[a-z0-9-]+)'
        required: false
      table:
        description: "db-integrity mode only, optional: one of venues, sources, events, discovery_queue, source_event_links, sync_locks — reports that table's information_schema columns (name/type/nullable/default) alongside the row counts every db-integrity run always prints."
        required: false
      endpoint:
        description: "https:// URL to check (reachability mode only)"
        required: false
      save_body_path:
        description: "Reachability mode only: path (under a runner-local scratch dir, e.g. /tmp/fixture.html) to save the full response body to, uploaded as a downloadable artifact — for capturing a real page fixture (see SOURCE_ONBOARDING.md's IMPLEMENT step). Omit for a bounded 4000-char body preview printed to the log instead."
        required: false
      print_full_body:
        description: "Reachability mode only, ignored if save_body_path is set: print the FULL response body to this job's log instead of a 4000-char preview. Use when the artifact download isn't reachable from where you're driving this workflow."
        required: false
        type: boolean
        default: false
      no_follow_redirects:
        description: "Reachability mode only: do NOT follow redirects — report the first response's own status and Location header (and print the chain hop by hop, up to 5 hops) instead of silently landing on the final URL. For verifying a host/permanent redirect itself, e.g. bare domain -> www."
        required: false
        type: boolean
        default: false
      body_start:
        description: "Reachability mode only, requires print_full_body=true: byte offset into the response body to start printing from (default 0) — for a page too large for either the job log's own tail-anchored retrieval cap or the save_body_path artifact download to return in one piece; walk the page in a few bounded requests via this and body_length instead."
        required: false
      body_length:
        description: "Reachability mode only, requires print_full_body=true: number of chars to print starting at body_start (default 200000)."
        required: false
      method:
        description: "Reachability mode only: HTTP method, GET (default) or POST."
        required: false
      body:
        description: "Reachability mode only: request body for --method=POST, sent as application/x-www-form-urlencoded (e.g. action=fetch_concerts&genres=Elektronisk)."
        required: false
      with_credentials:
        description: "Also test with real credentials, where wired (currently src-billetto only)"
        required: false
        type: boolean
        default: false
      limit:
        description: "Row cap for list-style modes (discovery-queue, source-links)"
        required: false
        default: "20"
      dedup_title:
        description: "Candidate title (dedup-simulate mode), or a case-insensitive title substring filter (event-integrity/link-role-audit modes, optional — omit to inspect every published event)"
        required: false
      dedup_artists:
        description: 'Candidate artists, comma-separated, e.g. "Artist A, Artist B" (dedup-simulate mode), or the artist list to run the real Rule A matcher against (youtube-preview-dry-run mode)'
        required: false
      dedup_venue:
        description: "Candidate venue name (dedup-simulate mode only)"
        required: false
      dedup_subvenue:
        description: "Candidate room/sub-venue override, e.g. \"Store VEGA\" (dedup-simulate mode only, generalized sub-venue model) — overrides whatever dedup_venue itself would resolve to, so a room-conflict scenario can be proven without needing dedup_venue to literally be the room's own raw string."
        required: false
      dedup_start:
        description: "Candidate start datetime, ISO 8601 (dedup-simulate mode only)"
        required: false
      dedup_url:
        description: "Candidate official event URL, optional (dedup-simulate mode only)"
        required: false
      detail_category:
        description: "admin-queue-audit mode only, optional: one of needs_review, venue_blocked, insufficient, rejected, past_stale — prints the full per-row field set (venue resolution, holdReason, genre evidence, description presence, links, etc.) for every row in that one category, not just id/title/sourceId. Diagnostic-only, never changes classification or writes anything."
        required: false
      detail_source:
        description: "admin-queue-audit mode only, optional: further narrows the detail_category dump to one source id (e.g. src-billetto)."
        required: false
      detail_limit:
        description: "admin-queue-audit mode only, optional: caps the number of detail_category rows printed, for paging through a large category across multiple runs."
        required: false
      detail_offset:
        description: "admin-queue-audit mode only, optional: skips this many detail_category rows (deterministic id order) before printing — combine with detail_limit to page exhaustively."
        required: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source_id format (when given)
        if: ${{ inputs.source_id != '' }}
        env:
          INPUT_SOURCE_ID: ${{ inputs.source_id }}
        run: |
          if ! [[ "$INPUT_SOURCE_ID" =~ ^src-[a-z0-9-]+$ ]]; then
            printf '::error::source_id must match src-[a-z0-9-]+ (e.g. src-hangaren), got: %s\n' "$INPUT_SOURCE_ID"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured (skipped for reachability/youtube-preview-dry-run modes with no DB access, and for artist-identity-audit, which never receives DATABASE_URL)
        if: ${{ inputs.mode != 'reachability' && inputs.mode != 'youtube-preview-dry-run' && inputs.mode != 'artist-identity-audit' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the diagnostic script
        if: ${{ inputs.mode != 'reachability' && inputs.mode != 'youtube-preview-dry-run' && inputs.mode != 'artist-identity-audit' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Run inspection
        if: ${{ inputs.mode != 'artist-identity-audit' }}
        env:
          BILLETTO_ACCESS_KEY_ID: ${{ secrets.BILLETTO_ACCESS_KEY_ID }}
          BILLETTO_ACCESS_KEY_SECRET: ${{ secrets.BILLETTO_ACCESS_KEY_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Every user-supplied input is passed through the environment and
          # only ever expanded inside double quotes below — never pasted into
          # the script text via ${{ }} — so shell-sensitive characters ($, `,
          # quotes, spaces, ;, |, backslash, newlines) reach inspectSource.ts as literal
          # values (e.g. the artist name ¥ØU$UK€ ¥UK1MAT$U).
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE_ID: ${{ inputs.source_id }}
          INPUT_ENDPOINT: ${{ inputs.endpoint }}
          INPUT_SAVE_BODY_PATH: ${{ inputs.save_body_path }}
          INPUT_PRINT_FULL_BODY: ${{ inputs.print_full_body }}
          INPUT_NO_FOLLOW_REDIRECTS: ${{ inputs.no_follow_redirects }}
          INPUT_BODY_START: ${{ inputs.body_start }}
          INPUT_BODY_LENGTH: ${{ inputs.body_length }}
          INPUT_METHOD: ${{ inputs.method }}
          INPUT_BODY: ${{ inputs.body }}
          INPUT_WITH_CREDENTIALS: ${{ inputs.with_credentials }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DEDUP_TITLE: ${{ inputs.dedup_title }}
          INPUT_DEDUP_ARTISTS: ${{ inputs.dedup_artists }}
          INPUT_DEDUP_VENUE: ${{ inputs.dedup_venue }}
          INPUT_DEDUP_SUBVENUE: ${{ inputs.dedup_subvenue }}
          INPUT_DEDUP_START: ${{ inputs.dedup_start }}
          INPUT_DEDUP_URL: ${{ inputs.dedup_url }}
          INPUT_TABLE: ${{ inputs.table }}
          INPUT_DETAIL_CATEGORY: ${{ inputs.detail_category }}
          INPUT_DETAIL_SOURCE: ${{ inputs.detail_source }}
          INPUT_DETAIL_LIMIT: ${{ inputs.detail_limit }}
          INPUT_DETAIL_OFFSET: ${{ inputs.detail_offset }}
        run: |
          set -u
          args=(--mode="$INPUT_MODE")
          [ -n "$INPUT_SOURCE_ID" ] && args+=(--source="$INPUT_SOURCE_ID")
          [ -n "$INPUT_ENDPOINT" ] && args+=(--endpoint="$INPUT_ENDPOINT")
          [ -n "$INPUT_SAVE_BODY_PATH" ] && args+=(--save-body="$INPUT_SAVE_BODY_PATH")
          [ "$INPUT_PRINT_FULL_BODY" = "true" ] && args+=(--print-full-body)
          [ "$INPUT_NO_FOLLOW_REDIRECTS" = "true" ] && args+=(--no-follow-redirects)
          [ -n "$INPUT_BODY_START" ] && args+=(--body-start="$INPUT_BODY_START")
          [ -n "$INPUT_BODY_LENGTH" ] && args+=(--body-length="$INPUT_BODY_LENGTH")
          [ -n "$INPUT_METHOD" ] && args+=(--method="$INPUT_METHOD")
          [ -n "$INPUT_BODY" ] && args+=(--body="$INPUT_BODY")
          [ "$INPUT_WITH_CREDENTIALS" = "true" ] && args+=(--with-credentials)
          [ -n "$INPUT_LIMIT" ] && args+=(--limit="$INPUT_LIMIT")
          [ -n "$INPUT_DEDUP_TITLE" ] && args+=(--title="$INPUT_DEDUP_TITLE")
          [ -n "$INPUT_DEDUP_ARTISTS" ] && args+=(--artists="$INPUT_DEDUP_ARTISTS")
          [ -n "$INPUT_DEDUP_VENUE" ] && args+=(--venue="$INPUT_DEDUP_VENUE")
          [ -n "$INPUT_DEDUP_SUBVENUE" ] && args+=(--subvenue="$INPUT_DEDUP_SUBVENUE")
          [ -n "$INPUT_DEDUP_START" ] && args+=(--start="$INPUT_DEDUP_START")
          [ -n "$INPUT_DEDUP_URL" ] && args+=(--url="$INPUT_DEDUP_URL")
          [ -n "$INPUT_TABLE" ] && args+=(--table="$INPUT_TABLE")
          [ -n "$INPUT_DETAIL_CATEGORY" ] && args+=(--detail-category="$INPUT_DETAIL_CATEGORY")
          [ -n "$INPUT_DETAIL_SOURCE" ] && args+=(--detail-source="$INPUT_DETAIL_SOURCE")
          [ -n "$INPUT_DETAIL_LIMIT" ] && args+=(--detail-limit="$INPUT_DETAIL_LIMIT")
          [ -n "$INPUT_DETAIL_OFFSET" ] && args+=(--detail-offset="$INPUT_DETAIL_OFFSET")
          if [ "$INPUT_MODE" = "reachability" ] || [ "$INPUT_MODE" = "youtube-preview-dry-run" ]; then
            node --import tsx src/db/inspectSource.ts "${args[@]}"
          else
            node --env-file=.env.local --import tsx src/db/inspectSource.ts "${args[@]}"
          fi

      # Artist Alerts identity audit (Phase A step 1, 2026-10-24) — a
      # separate, report-only CLI with its own connection, deliberately not
      # routed through inspectSource.ts: it receives ONLY the dedicated
      # read-only reporting role (DATABASE_URL_REPORT_RO), never
      # DATABASE_URL, and src/db/reportReadOnlyConnection.ts refuses to run
      # unless both the transaction and the role are verified unable to
      # write. No other input is used; no external service is called.
      - name: Run artist identity audit (dedicated read-only role)
        if: ${{ inputs.mode == 'artist-identity-audit' }}
        timeout-minutes: 10
        env:
          DATABASE_URL_REPORT_RO: ${{ secrets.DATABASE_URL_REPORT_RO }}
        run: |
          if [ -z "${DATABASE_URL_REPORT_RO:-}" ]; then
            echo "::error::Repository secret DATABASE_URL_REPORT_RO is not set. This mode only runs on the dedicated read-only reporting role and never falls back to DATABASE_URL."
            exit 1
          fi
          node --import tsx src/db/artistIdentityAuditCli.ts --out=artist-identity-audit.json

      - name: Upload artist identity audit report
        if: ${{ always() && inputs.mode == 'artist-identity-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: artist-identity-audit
          path: artist-identity-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload saved body as artifact
        if: ${{ inputs.save_body_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: reachability-body
          path: ${{ inputs.save_body_path }}
          retention-days: 7

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
