name: Verify Culture Box Detail-Page Preview Sync

# One-off, manual, confirmation-gated validation of the Culture Box
# detail-page (two-stage fetch) adapter against the Preview deployment for
# claude/culture-box-publishing-diagnosis-0qszf8. Mirrors
# verify-culture-box-preview.yml's exact safe pattern (BEFORE snapshot ->
# ONE real sync -> AFTER snapshot, every DB read inside its own explicit
# read-only transaction: BEGIN; SET LOCAL default_transaction_read_only =
# on; ...; ROLLBACK). The only write anywhere in this run happens inside
# the already-deployed Preview app's own /api/sync/culture-box handler,
# exactly once.
#
# Unlike verify-culture-box-preview.yml, the Preview base URL is NOT
# hardcoded here — it's looked up from GitHub's own Deployments API for
# this exact branch/commit using the workflow's built-in GITHUB_TOKEN,
# rather than guessed from Vercel's branch-slug URL convention (which
# truncates/hashes for long branch names and would be unreliable to
# hand-construct for this branch name).
#
# Secrets used: DATABASE_URL (read-only queries only), SYNC_TRIGGER_TOKEN
# and VERCEL_AUTOMATION_BYPASS_SECRET (sync trigger headers). None are ever
# echoed, printed, or included in any step output.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-CULTURE-BOX-DETAIL-PREVIEW-SYNC to confirm: this triggers ONE real Culture Box sync against the Preview deployment and the shared database.'
        required: true

permissions:
  contents: read
  deployments: read

concurrency:
  group: verify-culture-box-detail-preview
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RUN-CULTURE-BOX-DETAIL-PREVIEW-SYNC" ]; then
            echo "::error::Confirmation input did not match. Re-run and enter exactly: RUN-CULTURE-BOX-DETAIL-PREVIEW-SYNC"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/culture-box-publishing-diagnosis-0qszf8

      - name: Record the exact commit this run is verifying
        run: git rev-parse HEAD

      - name: Look up the real Preview deployment URL for this branch
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          repo="${{ github.repository }}"
          branch="claude/culture-box-publishing-diagnosis-0qszf8"
          deployment_id=$(gh api "repos/${repo}/deployments?ref=${branch}&environment=Preview&per_page=1" --jq '.[0].id')
          if [ -z "${deployment_id}" ] || [ "${deployment_id}" == "null" ]; then
            echo "::error::No Preview deployment found via GitHub Deployments API for branch ${branch}. Has Vercel finished building this branch yet?"
            exit 1
          fi
          echo "Deployment id: ${deployment_id}"
          url=$(gh api "repos/${repo}/deployments/${deployment_id}/statuses?per_page=1" --jq '.[0].environment_url')
          if [ -z "${url}" ] || [ "${url}" == "null" ]; then
            echo "::error::Deployment ${deployment_id} has no environment_url yet — it may still be building."
            exit 1
          fi
          echo "Resolved Preview URL: ${url}"
          echo "base_url=${url}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required secrets are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          missing=""
          [ -z "${DATABASE_URL:-}" ] && missing="${missing} DATABASE_URL"
          [ -z "${SYNC_TRIGGER_TOKEN:-}" ] && missing="${missing} SYNC_TRIGGER_TOKEN"
          [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ] && missing="${missing} VERCEL_AUTOMATION_BYPASS_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):${missing}"
            exit 1
          fi

      - name: Confirm the Preview deployment is actually reachable before touching anything
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -u
          http_code=$(curl -sS --max-time 30 -o /tmp/preview-home.html -w '%{http_code}' \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${PREVIEW_BASE_URL}/")
          echo "Preview homepage HTTP status: ${http_code}"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Preview base URL ${PREVIEW_BASE_URL} did not return 2xx (got ${http_code}) — stopping before any database read/write."
            exit 1
          fi

      - name: Install dependencies (pg only needed, but npm ci matches repo convention)
        run: npm ci

      - name: Write read-only DB snapshot script
        run: |
          cat > snapshot.cjs << 'SCRIPT'
          const { Client } = require('pg');

          async function main(client) {
            await client.connect();
            await client.query('BEGIN');
            await client.query('SET LOCAL default_transaction_read_only = on');

            const label = process.env.SNAPSHOT_LABEL || 'SNAPSHOT';
            console.log(`\n========== ${label} ==========`);

            for (const sourceId of ['src-culture-box', 'src-hangaren', 'src-poolen']) {
              const src = await client.query(
                `SELECT id, last_successful_sync, last_attempted_sync, last_error, events_found, events_updated
                 FROM sources WHERE id = $1`,
                [sourceId],
              );
              console.log(`\n-- sources row (${sourceId}) --`);
              console.log(JSON.stringify(src.rows, null, 2));

              const dq = await client.query(
                `SELECT id, probable_title, status, predicted_genre, genre_confidence, overall_confidence,
                        detected_lineup, missing_fields, suspected_duplicate_of_event_id, source_url, created_at
                 FROM discovery_queue WHERE source_id = $1 ORDER BY created_at`,
                [sourceId],
              );
              console.log(`\n-- discovery_queue (source_id=${sourceId}): ${dq.rows.length} rows --`);
              console.log(JSON.stringify(dq.rows, null, 2));

              const ev = await client.query(
                `SELECT id, title, venue_id, start_datetime, primary_genre, subgenres, genre_confidence,
                        confidence, published, manual_override, overridden_fields, official_event_url,
                        resident_advisor_url, description, created_at
                 FROM events WHERE canonical_source_id = $1 ORDER BY created_at`,
                [sourceId],
              );
              console.log(`\n-- events (canonical_source_id=${sourceId}): ${ev.rows.length} rows --`);
              console.log(JSON.stringify(ev.rows, null, 2));

              const links = await client.query(
                `SELECT event_id, source_id, source_url, role, first_seen_at
                 FROM source_event_links WHERE source_id = $1 ORDER BY first_seen_at`,
                [sourceId],
              );
              console.log(`\n-- source_event_links (source_id=${sourceId}): ${links.rows.length} rows --`);
              console.log(JSON.stringify(links.rows, null, 2));
            }

            // Global cross-checks: total counts by canonical source (did
            // anything outside Culture Box move?), and the full set of
            // manually-overridden events (did any get clobbered?).
            const byCanonicalSource = await client.query(
              `SELECT canonical_source_id, published, count(*)::int AS n FROM events GROUP BY canonical_source_id, published ORDER BY canonical_source_id NULLS FIRST, published`,
            );
            console.log(`\n-- events grouped by canonical_source_id + published (global) --`);
            console.log(JSON.stringify(byCanonicalSource.rows, null, 2));

            const dqByStatus = await client.query(
              `SELECT source_id, status, count(*)::int AS n FROM discovery_queue GROUP BY source_id, status ORDER BY source_id NULLS FIRST, status`,
            );
            console.log(`\n-- discovery_queue grouped by source_id + status (global) --`);
            console.log(JSON.stringify(dqByStatus.rows, null, 2));

            const overridden = await client.query(
              `SELECT id, overridden_fields, manual_override, updated_at FROM events
               WHERE array_length(overridden_fields, 1) > 0 OR manual_override = true
               ORDER BY id`,
            );
            console.log(`\n-- events with any manual override (global): ${overridden.rows.length} rows --`);
            console.log(JSON.stringify(overridden.rows, null, 2));

            const totalEvents = await client.query(`SELECT count(*)::int AS n FROM events`);
            console.log(`\n-- total events (global): ${totalEvents.rows[0].n} --`);

            await client.query('COMMIT');
          }

          const client = new Client({ connectionString: process.env.DATABASE_URL });
          main(client)
            .catch((err) => {
              console.error('SNAPSHOT FAILED:', err.message);
              process.exitCode = 1;
            })
            .finally(() => client.end());
          SCRIPT

      - name: "PHASE 1 — BEFORE snapshot"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_LABEL: BEFORE (pre-sync)
        run: node snapshot.cjs

      - name: "PHASE 2a — trigger the ONE real Preview Culture Box sync"
        env:
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -u
          response=$(curl -sS --max-time 180 -w '\n%{http_code}' \
            -X POST \
            -H "x-sync-token: ${SYNC_TRIGGER_TOKEN}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${PREVIEW_BASE_URL}/api/sync/culture-box")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Sync HTTP status: ${http_code}"
          echo "Sync response body: ${body}"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Culture Box sync request failed with HTTP ${http_code} — see response body above."
            exit 1
          fi

      - name: "PHASE 2b — trigger a SECOND real sync (idempotency check)"
        env:
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -u
          response=$(curl -sS --max-time 180 -w '\n%{http_code}' \
            -X POST \
            -H "x-sync-token: ${SYNC_TRIGGER_TOKEN}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${PREVIEW_BASE_URL}/api/sync/culture-box")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Second sync HTTP status: ${http_code}"
          echo "Second sync response body: ${body}"
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Second Culture Box sync request failed with HTTP ${http_code} — see response body above."
            exit 1
          fi

      - name: "PHASE 3 — AFTER snapshot (post both syncs)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAPSHOT_LABEL: AFTER (post both syncs)
        run: node snapshot.cjs

      - name: Remove local scratch script
        if: always()
        run: rm -f snapshot.cjs
