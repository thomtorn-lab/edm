name: Translate Event Descriptions

# English-only About descriptions (2026-10-15). Runs
# src/db/translateDescriptions.ts, which writes ONLY to
# event_description_translations — events.description is never modified.
# Each run handles at most `limit` pending events (default 40): a new event,
# a changed source description, or an earlier failure with retries left.
# An unchanged description that already has a result is never re-sent, and
# a clearly-English description is recorded without any API call.
#
# NOT ACTIVATED YET (2026-10-24): manual-only (`workflow_dispatch`) until
# translation is explicitly approved for Production. Activation is two
# small steps: add the ANTHROPIC_API_KEY secret, then add
#   schedule:
#     - cron: "23 * * * *"
# under `on:` so new/changed descriptions get their English version within
# about an hour and the existing backlog is worked through in batches. A
# scheduled run would use mode "apply" (see INPUT_MODE below). Without the
# secret, runs still succeed: clearly-English descriptions are recorded,
# everything else stays pending and hidden on the public site.
#
# Secrets used: DATABASE_URL, ANTHROPIC_API_KEY (optional). Optional
# repository variable DESCRIPTION_TRANSLATION_MODEL overrides the model.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '"plan" (read-only, spends nothing) or "apply" (writes translation rows, calls the API)'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      limit:
        description: "Max pending events to process this run. Defaults to the script's DEFAULT_RUN_LIMIT (40) when blank."
        required: false
      event:
        description: "Optional: process exactly this one event slug."
        required: false

permissions:
  contents: read

concurrency:
  group: translate-descriptions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Translate descriptions
        # Inputs reach the script only via env vars expanded inside double
        # quotes — never pasted into the script with ${{ }}.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESCRIPTION_TRANSLATION_MODEL: ${{ vars.DESCRIPTION_TRANSLATION_MODEL }}
          INPUT_MODE: ${{ inputs.mode || 'apply' }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_EVENT: ${{ inputs.event }}
        run: |
          set -u
          args=(--mode="$INPUT_MODE")
          [ -n "$INPUT_LIMIT" ] && args+=(--limit="$INPUT_LIMIT")
          [ -n "$INPUT_EVENT" ] && args+=(--event="$INPUT_EVENT")
          node --env-file=.env.local --import tsx src/db/translateDescriptions.ts "${args[@]}"

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
