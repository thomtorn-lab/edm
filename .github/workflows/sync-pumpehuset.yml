name: Sync Pumpehuset

# Scheduling entry point for the Pumpehuset ingestion adapter
# (src/lib/adapters/pumpehusetAdapter.ts). Calls the deployed app's
# POST /api/sync/pumpehuset on a fixed schedule, matching
# src/lib/data/sources.ts's `syncFrequency` for src-pumpehuset.
#
# Generated by scripts/scaffold-source.mjs from the same template as
# sync-hangaren.yml — identical structure/safety model, only the endpoint,
# cron offset and concurrency group differ. See README.md's "Scheduling"
# section for the full explanation (retry layers, concurrency, secrets).
#
# SYNC_BASE_URL / SYNC_TRIGGER_TOKEN / VERCEL_AUTOMATION_BYPASS_SECRET are
# shared repository-level secrets/variable already configured for the other
# sync-*.yml workflows. Cron offset (:50) doesn't collide with Hangaren
# (:00), Poolen (:15), Culture Box (:30) or Billetto (:45).

on:
  schedule:
    - cron: "50 */6 * * *"
  workflow_dispatch: {} # manual re-trigger, e.g. to retry after a fix

concurrency:
  group: sync-pumpehuset
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pumpehuset sync
        env:
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          if [ -z "${SYNC_BASE_URL}" ]; then
            echo "::error::Repository variable SYNC_BASE_URL is not set."
            exit 1
          fi
          if [ -z "${SYNC_TRIGGER_TOKEN}" ]; then
            echo "::error::Repository secret SYNC_TRIGGER_TOKEN is not set."
            exit 1
          fi
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "::error::Repository secret VERCEL_AUTOMATION_BYPASS_SECRET is not set."
            exit 1
          fi

          http_code=$(curl -sS \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 60 \
            -o /tmp/sync-response.json -w '%{http_code}' \
            -X POST \
            -H "x-sync-token: ${SYNC_TRIGGER_TOKEN}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${SYNC_BASE_URL}/api/sync/pumpehuset")

          echo "HTTP status: ${http_code}"
          echo "Response:"
          cat /tmp/sync-response.json
          echo

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Pumpehuset sync returned HTTP ${http_code} — see response body above."
            exit 1
          fi
