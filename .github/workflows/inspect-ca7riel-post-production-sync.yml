name: Inspect Ca7riel Row After Production Poolen Sync (read-only, diagnostic)

# ONE-OFF, manual, confirmation-gated, strictly READ-ONLY diagnostic.
# Confirms event e-2a630663 (Ca7riel y Paco Amoroso) is still published=
# false after the first real Production Poolen sync (GitHub Actions run
# 32222327414, https://www.electroniccph.com/api/sync/poolen, HTTP 200,
# outcome=ok/created=0/updated=14) — i.e. that the one-off correction made
# before the Production merge survived a real recurring-sync cycle against
# the live app, not just the earlier Preview-only validation. No writes
# anywhere in this file (BEGIN; SET LOCAL default_transaction_read_only =
# on; SELECT; ROLLBACK). Intended to be removed once confirmed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type INSPECT-CA7RIEL-POST-PROD to confirm: this only runs a read-only SELECT against the shared Preview/Production database.'
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "INSPECT-CA7RIEL-POST-PROD" ]; then
            echo "::error::Confirmation input did not match. Re-run and enter exactly: INSPECT-CA7RIEL-POST-PROD"
            exit 1
          fi

      - name: Verify required secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -u
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing required repository secret: DATABASE_URL"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pg
        run: npm install pg@8

      - name: Read-only SELECT of the Ca7riel events row
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > inspect.cjs << 'SCRIPT'
          const { Client } = require('pg');

          async function main(client) {
            await client.connect();
            await client.query('BEGIN');
            await client.query('SET LOCAL default_transaction_read_only = on');

            const row = await client.query(
              `SELECT id, title, published, primary_genre, genre_confidence,
                      manual_override, updated_at
               FROM events WHERE id = 'e-2a630663'`,
            );
            console.log('\n-- e-2a630663 (Ca7riel y Paco Amoroso) after first real Production sync --');
            console.log(JSON.stringify(row.rows, null, 2));

            await client.query('COMMIT');
          }

          const client = new Client({ connectionString: process.env.DATABASE_URL });
          main(client)
            .catch((err) => {
              console.error('QUERY FAILED:', err.message);
              process.exitCode = 1;
            })
            .finally(() => client.end());
          SCRIPT
          node inspect.cjs

      - name: Remove local scratch script
        if: always()
        run: rm -f inspect.cjs
