name: Inspect Sync Advisory Lock State (read-only, diagnostic)

# ONE-OFF, manual, confirmation-gated, strictly READ-ONLY diagnostic.
# Investigates why two consecutive Culture Box sync triggers, ~10+ minutes
# apart with no other workflow racing them, both returned
# outcome=skipped_concurrent — checking whether a Postgres advisory lock
# from src/db/sync.ts::runSourceSync is stuck held rather than released.
# Queries pg_locks joined to pg_stat_activity — standard, safe introspection
# views, no writes anywhere in this file (BEGIN; SET LOCAL
# default_transaction_read_only = on; SELECT; ROLLBACK).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type INSPECT-ADVISORY-LOCK to confirm: this only runs a read-only SELECT against pg_locks/pg_stat_activity.'
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "INSPECT-ADVISORY-LOCK" ]; then
            echo "::error::Confirmation input did not match. Re-run and enter exactly: INSPECT-ADVISORY-LOCK"
            exit 1
          fi

      - name: Verify required secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing required repository secret: DATABASE_URL"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pg
        run: npm install pg@8

      - name: Read-only inspection of advisory locks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > inspect.cjs << 'SCRIPT'
          const { Client } = require('pg');

          async function main(client) {
            await client.connect();
            await client.query('BEGIN');
            await client.query('SET LOCAL default_transaction_read_only = on');

            const locks = await client.query(
              `SELECT l.locktype, l.mode, l.granted, l.objid, l.pid,
                      a.state, a.query, a.query_start, a.state_change,
                      now() - a.query_start AS query_age,
                      now() - a.state_change AS state_age,
                      a.application_name, a.client_addr
               FROM pg_locks l
               LEFT JOIN pg_stat_activity a ON a.pid = l.pid
               WHERE l.locktype = 'advisory'
               ORDER BY a.query_start`,
            );
            console.log('\n-- pg_locks (advisory) joined to pg_stat_activity --');
            console.log(JSON.stringify(locks.rows, null, 2));

            // hashtext('src-culture-box') is what runSourceSync locks on —
            // compute it the same way Postgres does to confirm which objid,
            // if any, corresponds to Culture Box specifically.
            const hash = await client.query(`SELECT hashtext('src-culture-box') AS h, hashtext('src-hangaren') AS h2, hashtext('src-poolen') AS h3`);
            console.log('\n-- hashtext() values for each source id --');
            console.log(JSON.stringify(hash.rows, null, 2));

            const allActivity = await client.query(
              `SELECT pid, state, application_name, query_start, state_change,
                      now() - query_start AS query_age, left(query, 200) AS query_preview
               FROM pg_stat_activity
               WHERE datname = current_database()
               ORDER BY query_start`,
            );
            console.log('\n-- all pg_stat_activity rows on this database --');
            console.log(JSON.stringify(allActivity.rows, null, 2));

            await client.query('COMMIT');
          }

          const client = new Client({ connectionString: process.env.DATABASE_URL });
          main(client)
            .catch((err) => {
              console.error('QUERY FAILED:', err.message);
              process.exitCode = 1;
            })
            .finally(() => client.end());
          SCRIPT
          node inspect.cjs

      - name: Remove local scratch script
        if: always()
        run: rm -f inspect.cjs
