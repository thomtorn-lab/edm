name: TEMP - Den Anden Side Address Fix

# One-time, deliberately temporary workflow. Generic over venue id/address
# (first used for the Hangaren address correction, reused here for Den
# Anden Side — Krudtløbsvej 8, 2300 København S -> Axel Torv 5, 1609
# Copenhagen, matching denandenside.com's own current address). Runs
# src/db/fixVenueAddress.ts, which corrects one venue's stored address
# directly — venues are seeded once at bootstrap and not automatically
# kept in sync with later code-level fixture edits. Will be removed once
# this run is confirmed.
#
# Safety:
#   - workflow_dispatch only.
#   - mode=plan performs no writes at all (no write statement is even
#     reachable in that code path) — always run this first.
#   - mode=apply additionally requires typing the exact confirmation
#     string.
#   - DATABASE_URL is read only into the step environment via .env.local,
#     removed at the end of the run — never echoed or logged.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read-only, prints current vs proposed address) or apply (writes, requires confirm)"
        required: true
        type: choice
        options:
          - plan
          - apply
      venue_id:
        description: 'Venue id to correct, e.g. "v-den-anden-side"'
        required: true
      address:
        description: "New address value"
        required: true
      confirm:
        description: 'For mode=apply only: must be exactly "FIX-VENUE-ADDRESS"'
        required: false

permissions:
  contents: read

jobs:
  fix-address:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Run address fix
        run: |
          set -u
          args=(--mode="${{ inputs.mode }}" --venue="${{ inputs.venue_id }}" --address="${{ inputs.address }}")
          [ -n "${{ inputs.confirm }}" ] && args+=(--confirm="${{ inputs.confirm }}")
          node --env-file=.env.local --import tsx src/db/fixVenueAddress.ts "${args[@]}"

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
