name: Audit Sub-venue Title Patterns (Production, read-only)

# One-time, manual, strictly read-only Production audit for the
# sub-venue-title-cleanup task (Pumpehuset "Byhaven:" prefix, Culture Box
# "Black Box:"/"Red Box:" room-prefixed titles). No writes of any kind.
# workflow_dispatch only. The query script is written to a throwaway file
# during the run and removed immediately after — never committed. This
# workflow file itself is removed in a follow-up commit once the audit
# results have been captured.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Read-only audit query
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > ./.audit-subvenue-titles.mjs <<'EOF'
          import pg from "pg";

          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });

          function section(title) {
            console.log(`\n=== ${title} ===`);
          }

          try {
            await client.connect();
            await client.query("BEGIN");
            await client.query("SET LOCAL default_transaction_read_only = on");
            await client.query("SET LOCAL statement_timeout = '20s'");

            section("Pumpehuset events with title starting 'Byhaven:'");
            const pumpehuset = await client.query(
              `SELECT e.id, e.title, e.description, e.published, e.start_datetime
               FROM events e JOIN venues v ON v.id = e.venue_id
               WHERE v.id = 'v-pumpehuset' AND e.title LIKE 'Byhaven:%'
               ORDER BY e.start_datetime`,
            );
            console.log(`Count: ${pumpehuset.rowCount}`);
            for (const r of pumpehuset.rows) {
              console.log(JSON.stringify({ id: r.id, published: r.published, start: r.start_datetime, title: r.title }));
            }

            section("All Pumpehuset events (for context - any other 'Byhaven' mentions not at start?)");
            const allPumpehuset = await client.query(
              `SELECT e.id, e.title, e.published
               FROM events e JOIN venues v ON v.id = e.venue_id
               WHERE v.id = 'v-pumpehuset'
               ORDER BY e.start_datetime`,
            );
            console.log(`Total Pumpehuset events: ${allPumpehuset.rowCount}`);
            for (const r of allPumpehuset.rows) {
              if (r.title.toLowerCase().includes("byhaven")) {
                console.log(" byhaven-mention:", JSON.stringify({ id: r.id, published: r.published, title: r.title }));
              }
            }

            section("Culture Box events with title containing 'Black Box' or 'Red Box'");
            const cultureBox = await client.query(
              `SELECT e.id, e.title, e.description, e.artists, e.published, e.start_datetime
               FROM events e JOIN venues v ON v.id = e.venue_id
               WHERE v.id = 'v-culture-box' AND (e.title LIKE '%Black Box%' OR e.title LIKE '%Red Box%')
               ORDER BY e.start_datetime`,
            );
            console.log(`Count: ${cultureBox.rowCount}`);
            for (const r of cultureBox.rows) {
              console.log(JSON.stringify({
                id: r.id,
                published: r.published,
                start: r.start_datetime,
                title: r.title,
                artists: r.artists,
                description: r.description,
              }));
            }

            section("All Culture Box events (for context - how many total, any without room prefix already?)");
            const allCultureBox = await client.query(
              `SELECT e.id, e.title, e.published
               FROM events e JOIN venues v ON v.id = e.venue_id
               WHERE v.id = 'v-culture-box'
               ORDER BY e.start_datetime`,
            );
            console.log(`Total Culture Box events: ${allCultureBox.rowCount}`);
            for (const r of allCultureBox.rows) {
              console.log(" ", JSON.stringify({ id: r.id, published: r.published, title: r.title }));
            }

            await client.query("ROLLBACK");
            console.log("\nTransaction rolled back (read-only). No writes performed.");
          } catch (err) {
            try { await client.query("ROLLBACK"); } catch {}
            console.error("AUDIT SCRIPT ERROR:", err);
            process.exitCode = 1;
          } finally {
            await client.end();
          }
          EOF
          node ./.audit-subvenue-titles.mjs
          rm -f ./.audit-subvenue-titles.mjs
