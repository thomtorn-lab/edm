name: Translation Integration Check

# Real-API check of the About-text translation code (2026-10-25). Runs
# src/db/translationIntegrationCheck.ts against the 9 fixed fixture texts in
# src/lib/translation/__fixtures__/integration/ — NO database, NO Production
# data, no DATABASE_URL. It is the only thing this workflow does.
#
# PAID: each run calls the Anthropic API (Claude Sonnet 5.5) for the samples
# that are not clearly English. The model and the budget are fixed below,
# not inputs: the script's budget guard stops before any call that could take
# total spend over $0.10 (spend so far from the API's own usage numbers +
# the next call's worst case).
#
# Never runs on push. It runs only when someone deliberately:
#   - adds the label `run-translation-check` to a pull request from this
#     repository (works before merge — the run uses the PR's own code), or
#   - starts it by hand (`workflow_dispatch`, available once this file is on
#     the default branch).
# Remove the label afterwards; adding it again starts another paid run.
#
# Secret used: ANTHROPIC_API_KEY (repository secret). It is passed to the
# script only as an environment variable and never printed; GitHub also
# masks it in logs. The report (results, validator outcomes, tokens, cost —
# never the key) is uploaded as a run artifact and shown in the job summary.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translation-integration-check
  cancel-in-progress: false

jobs:
  run:
    # Only for the deliberate label, and never for a fork's pull request
    # (forks get no secrets, and their code must not run with ours).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-translation-check' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify ANTHROPIC_API_KEY secret is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run integration check (budget-capped at $0.10)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -u
          node --import tsx src/db/translationIntegrationCheck.ts \
            --confirm-paid \
            --model=claude-sonnet-5-5 \
            --max-cost-usd=0.10 \
            --out=translation-integration-report.md

      - name: Add report to the job summary
        if: always()
        run: |
          if [ -f translation-integration-report.md ]; then cat translation-integration-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-integration-report
          path: translation-integration-report.md
          if-no-files-found: ignore
