name: Diagnose Billetto API (read-only)

# One-off, manual diagnostic (Billetto Electronic CPH ingestion, Phase 1):
# the agent sandbox this investigation is running in cannot reach
# billetto.dk at all (confirmed: CONNECT tunnel failure on every attempt),
# so this workflow answers the diagnosis questions from a
# network-unrestricted environment instead — same pattern as
# verify-discogs-reachability.yml. Temporarily added to the default branch
# because workflow_dispatch dispatch via the API requires the workflow file
# to exist there; will be removed again immediately after use, same as the
# prior one-off inspect-post-merge-readonly.yml.
#
# READ ONLY. Every request is a plain GET against Billetto's public events
# endpoint. No writes to Billetto, no database access, nothing destructive.
# Only ever logs event data (which is public by definition — that's the
# whole point of the "public events" endpoint) and HTTP status codes.
# NEVER logs the Api-Keypair header value or either secret.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets are present
        env:
          BILLETTO_ACCESS_KEY_ID: ${{ secrets.BILLETTO_ACCESS_KEY_ID }}
          BILLETTO_ACCESS_KEY_SECRET: ${{ secrets.BILLETTO_ACCESS_KEY_SECRET }}
        run: |
          set -u
          missing=0
          if [ -z "${BILLETTO_ACCESS_KEY_ID}" ]; then
            echo "::error::Repository secret BILLETTO_ACCESS_KEY_ID is not set."
            missing=1
          fi
          if [ -z "${BILLETTO_ACCESS_KEY_SECRET}" ]; then
            echo "::error::Repository secret BILLETTO_ACCESS_KEY_SECRET is not set."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "Both secrets are set (values not logged)."

      - name: "Diagnostic: try both candidate API hosts (billetto.dk vs api.billetto.com)"
        env:
          BILLETTO_ACCESS_KEY_ID: ${{ secrets.BILLETTO_ACCESS_KEY_ID }}
          BILLETTO_ACCESS_KEY_SECRET: ${{ secrets.BILLETTO_ACCESS_KEY_SECRET }}
        run: |
          set -u
          echo "=== Host A: https://billetto.dk/api/v3/public/events ==="
          http_code=$(curl -sS --max-time 20 -o hostA.json -w '%{http_code}' \
            -H "Api-Keypair: ${BILLETTO_ACCESS_KEY_ID}:${BILLETTO_ACCESS_KEY_SECRET}" \
            "https://billetto.dk/api/v3/public/events?limit=5")
          echo "HTTP status: ${http_code}"
          cat hostA.json; echo

          echo "=== Host B: https://api.billetto.com/v3/public/events ==="
          http_code=$(curl -sS --max-time 20 -o hostB.json -w '%{http_code}' \
            -H "Api-Keypair: ${BILLETTO_ACCESS_KEY_ID}:${BILLETTO_ACCESS_KEY_SECRET}" \
            "https://api.billetto.com/v3/public/events?limit=5")
          echo "HTTP status: ${http_code}"
          cat hostB.json; echo

          echo "=== Host C: https://api.billetto.com/v3/public/events (no leading /public, in case path differs) ==="
          http_code=$(curl -sS --max-time 20 -o hostC.json -w '%{http_code}' \
            -H "Api-Keypair: ${BILLETTO_ACCESS_KEY_ID}:${BILLETTO_ACCESS_KEY_SECRET}" \
            "https://api.billetto.com/v3/events?limit=5")
          echo "HTTP status: ${http_code}"
          cat hostC.json; echo

      - name: Upload raw responses as artifact (diagnostic only — no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: billetto-host-diagnosis
          path: |
            hostA.json
            hostB.json
            hostC.json
          retention-days: 7
          if-no-files-found: warn
