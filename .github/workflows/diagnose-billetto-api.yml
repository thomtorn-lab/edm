name: Diagnose Billetto API (read-only)

# Third pass, Phase 1: category=music is confirmed a real filter with a
# techno/house subcategory taxonomy; city=Copenhagen/Kobenhavn confirmed as
# real filters too. This pass combines them, tests subcategory-level
# filtering, and scans a wider category=music sample for the two known
# overlap events and general electronic-Copenhagen coverage. READ ONLY.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: "Combined filters: category=music + subcategory + city"
        env:
          BILLETTO_ACCESS_KEY_ID: ${{ secrets.BILLETTO_ACCESS_KEY_ID }}
          BILLETTO_ACCESS_KEY_SECRET: ${{ secrets.BILLETTO_ACCESS_KEY_SECRET }}
        run: |
          set -u
          for pair in "category=music&subcategory=techno" "category=music&subcategory=house" "category=music&city=Copenhagen" "category=music&city=K%C3%B8benhavn" "category=music&region=Hovedstaden" "category=music&subregion=Byen%20K%C3%B8benhavn"; do
            key=$(echo "$pair" | tr -c 'A-Za-z0-9' '_')
            echo "=== ${pair} ==="
            curl -sS --max-time 20 -o "comb-${key}.json" \
              -H "Api-Keypair: ${BILLETTO_ACCESS_KEY_ID}:${BILLETTO_ACCESS_KEY_SECRET}" \
              "https://billetto.dk/api/v3/public/events?limit=100&${pair}"
            f="comb-${key}.json"
            jq '.data | length' "$f" 2>/dev/null || cat "$f"
            jq '[.data[] | {city: .location.city, sub: .categorization.subcategory}] | unique' "$f" 2>/dev/null || true
          done

      - name: "Wider category=music sample (5 pages), scan for overlap + Copenhagen electronic events"
        env:
          BILLETTO_ACCESS_KEY_ID: ${{ secrets.BILLETTO_ACCESS_KEY_ID }}
          BILLETTO_ACCESS_KEY_SECRET: ${{ secrets.BILLETTO_ACCESS_KEY_SECRET }}
        run: |
          set -u
          : > music.jsonl
          after=""
          for i in 1 2 3 4 5; do
            url="https://billetto.dk/api/v3/public/events?limit=100&category=music"
            if [ -n "$after" ]; then url="${url}&after=${after}"; fi
            curl -sS --max-time 20 -o "musicpage-${i}.json" \
              -H "Api-Keypair: ${BILLETTO_ACCESS_KEY_ID}:${BILLETTO_ACCESS_KEY_SECRET}" \
              "$url"
            n=$(jq '.data | length' "musicpage-${i}.json" 2>/dev/null || echo 0)
            echo "page ${i}: ${n} events"
            jq -c '.data[]' "musicpage-${i}.json" >> music.jsonl 2>/dev/null || true
            after=$(jq -r '.data[-1].id // empty' "musicpage-${i}.json")
            if [ -z "$after" ] || [ "$n" -lt 100 ]; then echo "reached end at page ${i}"; break; fi
          done
          echo "--- total music events collected ---"; wc -l music.jsonl
          echo "--- subcategory distribution ---"
          jq -s '[.[].categorization.subcategory] | group_by(.) | map({sub: .[0], n: length}) | sort_by(-.n)' music.jsonl
          echo "--- Copenhagen-located electronic subcategory events (techno/house/hardcore/disco) ---"
          jq -c 'select((.location.city // "" | test("^K.?benhavn")) and (.categorization.subcategory | test("techno|house|hardcore|disco"))) | {id,title,url,startdate,venue: .location.location_name, sub: .categorization.subcategory, organiser: .organiser.name}' music.jsonl > cph-electronic.jsonl
          cat cph-electronic.jsonl
          echo "--- exact title/organiser scan for known overlap events across ALL music events (any city) ---"
          jq -c 'select((.title // "" | ascii_downcase | test("possessed|arcanum|infected mushroom")) or (.organiser.name // "" | ascii_downcase | test("arcanum")))' music.jsonl

      - name: Upload raw responses as artifact (public event data only — no secrets)
        uses: actions/upload-artifact@v4
        with:
          name: billetto-diagnosis-pass3
          path: |
            comb-*.json
            musicpage-*.json
            music.jsonl
            cph-electronic.jsonl
          retention-days: 7
          if-no-files-found: warn
