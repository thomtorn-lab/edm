name: YouTube Preview Risk Report (Read-Only)

# Read-only review input for the YouTube preview enrichment plan
# (2026-10-14), run by src/db/youtubePreviewRiskReportCli.ts:
#
# 1. Offline replay of PROPOSED Rule A identity checks against the evidence
#    already stored on every accepted artist_youtube_preview_cache row —
#    lists every accepted match a proposed rule would touch.
# 2. Report-only classification of every lineup name (events +
#    discovery_queue) with the narrow non-artist rules — lists what each
#    rule would flag and which flagged names hold an accepted match.
# 3./4. Headliner priority per upcoming event against what the event page
#    shows today (getEventYoutubePreview, event overrides included), and
#    the owner's decision basis. 0. The manual choices as they stand
#    (migration 0023, event overrides, artist pins and blocks).
#
# Nothing is enforced, blocked, replaced or written. Logic and tests:
# src/lib/enrichment/youtubePreviewRuleReplay.ts,
# src/lib/enrichment/artistNameClassification.ts,
# src/db/youtubePreviewRiskReport.ts (+ .test.ts files).
#
# One-off run before merge (owner request 2026-10-24): workflow_dispatch
# only works once this file is on the default branch, so while PR #141 is
# open the job can also be started by adding the label
# "run-youtube-risk-report" to PR #141 — the "pull_request: labeled" event
# runs this file from the PR's merge ref. Only someone with write access can
# add a label; the job is skipped for every other label, PR, or a fork.
# This trigger is removed again after that one run.
#
# Safety: no inputs. Uses DATABASE_URL_REPORT_RO only — a dedicated Postgres
# role with SELECT on the report's tables and nothing else (setup:
# docs/youtube-preview-risk-report-readonly-role.md). Not DATABASE_URL, and no
# YOUTUBE_API_KEY, so it cannot call YouTube. Before reading any data the
# report proves from the catalogs that the role cannot write and stops
# otherwise (src/db/reportReadOnlyGuard.ts). BEGIN READ ONLY (verified with
# SHOW transaction_read_only before any query; the run aborts otherwise),
# SELECT-only queries, ROLLBACK. The JSON report is uploaded as a run
# artifact; nothing else leaves the runner.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: youtube-preview-risk-report
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-youtube-risk-report' &&
      github.event.pull_request.number == 141 &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL_REPORT_RO secret is configured
        env:
          DATABASE_URL_REPORT_RO: ${{ secrets.DATABASE_URL_REPORT_RO }}
        run: |
          if [ -z "${DATABASE_URL_REPORT_RO:-}" ]; then
            echo "::error::Repository secret DATABASE_URL_REPORT_RO is not set (Settings > Secrets and variables > Actions > Secrets). See docs/youtube-preview-risk-report-readonly-role.md."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run YouTube preview risk report
        env:
          DATABASE_URL_REPORT_RO: ${{ secrets.DATABASE_URL_REPORT_RO }}
        run: node --import tsx src/db/youtubePreviewRiskReportCli.ts --out=youtube-preview-risk-report.json

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-preview-risk-report
          path: youtube-preview-risk-report.json
          if-no-files-found: ignore
          retention-days: 30
