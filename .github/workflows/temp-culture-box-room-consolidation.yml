name: TEMP - Culture Box Room Consolidation

# One-time, deliberately temporary workflow (partner-ready polish pass —
# "Culture Box — transition cleanup" task). Mirrors this repo's own
# established pattern for a one-time Production action (see git history:
# temp-sync-billetto-registry.yml / the Culture Box source-registry sync
# workflow, each added, run once, then removed). Runs
# src/db/cultureBoxRoomConsolidation.ts, which merges any still-live
# Black Box/Red Box canonical-event pair down to one survivor and hides the
# obsolete sibling — see that script's own header comment and
# src/lib/cultureBoxConsolidation.ts for the full design. Will be removed
# once this run is confirmed.
#
# Safety:
#   - workflow_dispatch only.
#   - mode=plan performs no writes at all (no write statement is even
#     reachable in that code path) — always run this first.
#   - mode=apply additionally requires typing the exact confirmation string,
#     matching this repo's existing confirm-gate convention (see
#     validate-source.yml / verify-preview-enrichment.yml).
#   - DATABASE_URL is read only into the step environment via .env.local,
#     removed at the end of the run — never echoed or logged.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (read-only, prints every pair + patch) or apply (writes, requires confirm)"
        required: true
        type: choice
        options:
          - plan
          - apply
      confirm:
        description: 'For mode=apply only: must be exactly "CONSOLIDATE-CULTURE-BOX-ROOMS"'
        required: false

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write DATABASE_URL for the script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.local

      - name: Run consolidation
        run: |
          set -u
          args=(--mode="${{ inputs.mode }}")
          [ -n "${{ inputs.confirm }}" ] && args+=(--confirm="${{ inputs.confirm }}")
          node --env-file=.env.local --import tsx src/db/cultureBoxRoomConsolidation.ts "${args[@]}"

      - name: Remove local env file
        if: always()
        run: rm -f .env.local
