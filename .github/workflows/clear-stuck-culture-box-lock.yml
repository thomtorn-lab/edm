name: Clear Stuck Culture Box Advisory Lock

# One-off, manual, narrowly-scoped recovery action to clear a confirmed
# stuck Postgres advisory lock on backend PID 530387, which has held the
# Culture Box lock key (classid=4294967295, objid=4233766550, i.e. the
# single-bigint split of hashtext('src-culture-box') cast to bigint)
# continuously since backend_start=2026-08-19T11:06:04Z, confirmed via two
# independent read-only diagnostic runs ~1.6 minutes apart
# (diagnose-stuck-lock-detailed.yml).
#
# This workflow performs exactly ONE write-adjacent action:
# `SELECT pg_terminate_backend($1)` targeted at the exact confirmed PID,
# using a required typed confirmation input to prevent accidental dispatch.
# It does NOT call pg_advisory_unlock() (Supavisor pooling can route that
# call to a different backend, making it unreliable/unsafe here) and does
# NOT touch any application table.
#
# Structure (three separate, short-lived connections, to avoid the
# self-observation edge case where our own diagnostic connection might be
# routed by Supavisor onto the very backend under investigation):
#   1. PRE-CHECK connection: re-reads PID 530387's current state
#      immediately before termination. Captures its own backend pid so a
#      self-observation artifact (our own read query briefly making 530387
#      look "active") is correctly distinguished from genuine unrelated
#      application activity by checking whether any *application* table
#      (events, discovery_queue, sources, venues, source_event_links,
#      event_change_log, artist_genre_cache) is locked, not just system
#      catalogs our own introspection queries touch. STOPS (exits
#      nonzero, terminates nothing) if the PID differs from 530387, no
#      longer holds the Culture Box lock, or holds any lock on an
#      application table.
#   2. TERMINATE connection: exactly one statement,
#      `SELECT pg_terminate_backend(530387)`.
#   3. POST-CHECK connection: verifies the Culture Box lock
#      (classid=4294967295, objid=4233766550) is no longer held by ANY
#      pid, and that Hangaren / Poolen advisory lock keys are unaffected
#      (still 0 holders each).
#
# Requires typing the exact confirmation phrase as input to run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: TERMINATE-530387-CULTURE-BOX to proceed'
        required: true

permissions:
  contents: read

jobs:
  clear-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "TERMINATE-530387-CULTURE-BOX" ]; then
            echo "::error::Confirmation phrase did not match. Aborting, nothing was touched."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Clear the stuck lock (gated, targeted, verified)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > ./.clear-lock.mjs <<'EOF'
          import pg from "pg";

          const TARGET_PID = 530387;
          const CULTURE_BOX_CLASSID = "4294967295";
          const CULTURE_BOX_OBJID = "4233766550";
          const APP_TABLES = [
            "events", "discovery_queue", "sources", "venues",
            "source_event_links", "event_change_log", "artist_genre_cache",
          ];

          function section(title) {
            console.log(`\n=== ${title} ===`);
          }

          async function withClient(fn) {
            const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              return await fn(client);
            } finally {
              await client.end();
            }
          }

          let stop = false;
          let stopReason = "";

          // ---- 1. PRE-CHECK ----
          section("GATE 1-4: Pre-termination re-check of PID " + TARGET_PID);
          const preCheck = await withClient(async (client) => {
            await client.query("BEGIN");
            await client.query("SET LOCAL default_transaction_read_only = on");
            await client.query("SET LOCAL statement_timeout = '15s'");

            const { rows: [{ mypid }] } = await client.query("SELECT pg_backend_pid() AS mypid");
            console.log(`This diagnostic connection's own backend pid: ${mypid}`);
            const selfObserving = String(mypid) === String(TARGET_PID);
            if (selfObserving) {
              console.log("NOTE: This connection was routed by the pooler onto the exact target PID. " +
                "Any 'active'/query state below reflects this connection's own read, not unrelated activity. " +
                "Falling back to the application-table-lock check to rule out genuine concurrent work.");
            }

            const advRes = await client.query(
              `SELECT classid, objid, mode, granted, pid FROM pg_locks
               WHERE locktype = 'advisory' AND pid = $1`,
              [TARGET_PID],
            );
            console.log(`Advisory locks held by PID ${TARGET_PID}: ${advRes.rowCount}`);
            for (const r of advRes.rows) console.log(" ", r);

            const holdsCultureBox = advRes.rows.some(
              (r) => String(r.classid) === CULTURE_BOX_CLASSID && String(r.objid) === CULTURE_BOX_OBJID,
            );
            const holdsOtherAdvisory = advRes.rows.some(
              (r) => !(String(r.classid) === CULTURE_BOX_CLASSID && String(r.objid) === CULTURE_BOX_OBJID),
            );

            const actRes = await client.query(
              `SELECT pid, state, xact_start, query_start, backend_start, wait_event_type, wait_event, query
               FROM pg_stat_activity WHERE pid = $1`,
              [TARGET_PID],
            );
            console.log(`pg_stat_activity rows for PID ${TARGET_PID}: ${actRes.rowCount}`);
            for (const r of actRes.rows) console.log(" ", r);

            const allLocksRes = await client.query(
              `SELECT locktype, relation::regclass::text AS relation, mode, granted
               FROM pg_locks WHERE pid = $1`,
              [TARGET_PID],
            );
            const appTableLocks = allLocksRes.rows.filter((r) => APP_TABLES.includes(r.relation));
            console.log(`Locks on application tables held by PID ${TARGET_PID}: ${appTableLocks.length}`);
            for (const r of appTableLocks) console.log(" ", r);

            await client.query("ROLLBACK");

            return {
              mypid,
              selfObserving,
              rowCount: actRes.rowCount,
              backendStart: actRes.rows[0]?.backend_start ?? null,
              holdsCultureBox,
              holdsOtherAdvisory,
              appTableLockCount: appTableLocks.length,
            };
          });

          console.log("\nPre-check summary:", preCheck);

          if (preCheck.rowCount === 0) {
            stop = true;
            stopReason = `PID ${TARGET_PID} no longer exists in pg_stat_activity (already gone). Nothing to terminate.`;
          } else if (!preCheck.holdsCultureBox) {
            stop = true;
            stopReason = `PID ${TARGET_PID} no longer holds the Culture Box advisory lock. Aborting — target assumption invalidated.`;
          } else if (preCheck.holdsOtherAdvisory) {
            stop = true;
            stopReason = `PID ${TARGET_PID} holds advisory lock(s) other than Culture Box. Aborting per Gate 3/7 — could affect Hangaren/Poolen.`;
          } else if (preCheck.appTableLockCount > 0) {
            stop = true;
            stopReason = `PID ${TARGET_PID} holds lock(s) on application tables — looks like genuine active work, not stale. Aborting per Gate 4.`;
          }

          if (stop) {
            console.error(`\n::error::STOPPING, no termination attempted. Reason: ${stopReason}`);
            process.exit(1);
          }

          console.log(`\nAll pre-termination gates passed for PID ${TARGET_PID}. ` +
            `Holds exactly the Culture Box advisory lock, no other advisory locks, no application-table locks. ` +
            `backend_start=${preCheck.backendStart}. Proceeding to terminate.`);

          // ---- 2. TERMINATE ----
          section("GATE 5: Terminate PID " + TARGET_PID + " only");
          const termResult = await withClient(async (client) => {
            const { rows } = await client.query("SELECT pg_terminate_backend($1) AS terminated", [TARGET_PID]);
            return rows[0];
          }).catch((err) => {
            console.log(`Terminate call raised (possibly self-termination if this connection was PID ${TARGET_PID}): ${err.message}`);
            return { terminated: "unknown (connection dropped, will verify independently)" };
          });
          console.log("pg_terminate_backend result:", termResult);

          // ---- 3. POST-CHECK ----
          section("GATE 6-7: Post-termination verification");
          const postCheck = await withClient(async (client) => {
            await client.query("BEGIN");
            await client.query("SET LOCAL default_transaction_read_only = on");
            await client.query("SET LOCAL statement_timeout = '15s'");

            const cultureBoxRes = await client.query(
              `SELECT pid FROM pg_locks WHERE locktype = 'advisory' AND classid = $1 AND objid = $2`,
              [CULTURE_BOX_CLASSID, CULTURE_BOX_OBJID],
            );
            console.log(`Remaining holders of the Culture Box advisory lock: ${cultureBoxRes.rowCount}`);
            for (const r of cultureBoxRes.rows) console.log(" ", r);

            const stillAliveRes = await client.query(
              `SELECT pid, state FROM pg_stat_activity WHERE pid = $1`,
              [TARGET_PID],
            );
            console.log(`PID ${TARGET_PID} still present in pg_stat_activity: ${stillAliveRes.rowCount > 0}`);
            for (const r of stillAliveRes.rows) console.log(" ", r);

            // Hangaren / Poolen keys, recomputed the same way the app computes them.
            const hashRes = await client.query(
              `SELECT id,
                      (hashtext(id)::bigint >> 32) & 4294967295 AS classid,
                      hashtext(id)::bigint & 4294967295 AS objid
               FROM (SELECT unnest($1::text[]) AS id) t`,
              [["src-hangaren", "src-poolen"]],
            );
            for (const row of hashRes.rows) {
              const holders = await client.query(
                `SELECT pid FROM pg_locks WHERE locktype = 'advisory' AND classid = $1 AND objid = $2`,
                [row.classid, row.objid],
              );
              console.log(`  ${row.id} (classid=${row.classid}, objid=${row.objid}): ${holders.rowCount} holder(s)`);
              for (const r of holders.rows) console.log("   ", r);
            }

            await client.query("ROLLBACK");
            return { cultureBoxHolders: cultureBoxRes.rowCount, targetStillAlive: stillAliveRes.rowCount > 0 };
          });

          console.log("\nPost-check summary:", postCheck);

          if (postCheck.cultureBoxHolders > 0) {
            console.error("::error::Culture Box advisory lock is STILL held after termination attempt. Manual follow-up required.");
            process.exit(1);
          }
          if (postCheck.targetStillAlive) {
            console.error(`::error::PID ${TARGET_PID} is still present in pg_stat_activity after termination. Manual follow-up required.`);
            process.exit(1);
          }

          console.log("\nSUCCESS: Culture Box advisory lock cleared. Target backend terminated. No other locks touched.");
          EOF
          node ./.clear-lock.mjs
          rm -f ./.clear-lock.mjs
