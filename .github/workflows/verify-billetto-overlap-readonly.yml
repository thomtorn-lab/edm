name: Verify Billetto Overlap (Read-Only)

# One-off, manual, read-only Production verification (Billetto Electronic
# CPH implementation, validation requirement #7): fetches the REAL current
# Billetto listing (the exact same subregion=Byen København pagination the
# real adapter uses), looks up the known candidate overlap event IDs within
# it, reads the REAL stored Production rows for the events they might
# overlap (Poolen's Infected Mushroom, Hangaren's Arcanum Collective:
# POSSESSED, and any Faustix-titled Poolen event), and runs the REAL,
# unmodified assessDuplicate/findSyncMatch logic (src/lib/dedup.ts,
# src/lib/sync.ts) against the actual stored data -- not an assumption, not
# a reconstruction from a fixture.
#
# Strictly read-only:
#   - workflow_dispatch only.
#   - The only database access is one explicit transaction with
#     `SET LOCAL default_transaction_read_only = on`, always ROLLBACK'd.
#   - The only Billetto API access is plain GET requests.
#   - No migrations, no seed script, no application sync, no deployment.
#
# The verification script is written to a throwaway file on the runner
# during the run step and removed immediately after -- it is never
# committed to this repository, mirroring verify-db-readonly.yml's exact
# pattern. Secrets (DATABASE_URL, BILLETTO_ACCESS_KEY_ID/SECRET) are never
# echoed, printed, or included in any step output.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/billetto-electronic-cph-pn5ggy

      - name: Record the exact commit this run is verifying
        run: git rev-parse HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required secrets are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BILLETTO_ACCESS_KEY_ID: ${{ secrets.BILLETTO_ACCESS_KEY_ID }}
          BILLETTO_ACCESS_KEY_SECRET: ${{ secrets.BILLETTO_ACCESS_KEY_SECRET }}
        run: |
          set -u
          missing=""
          [ -z "${DATABASE_URL:-}" ] && missing="${missing} DATABASE_URL"
          [ -z "${BILLETTO_ACCESS_KEY_ID:-}" ] && missing="${missing} BILLETTO_ACCESS_KEY_ID"
          [ -z "${BILLETTO_ACCESS_KEY_SECRET:-}" ] && missing="${missing} BILLETTO_ACCESS_KEY_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):${missing}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write read-only overlap verification script
        run: |
          cat > ./.verify-billetto-overlap.ts << 'SCRIPT'
          import { Client } from "pg";
          import { findBestDuplicateMatch, normalizeUrl } from "./src/lib/dedup";
          import { findSyncMatch } from "./src/lib/sync";
          import { mapBillettoEvent, buildApiKeypairHeader, BILLETTO_API_URL, type BillettoEvent } from "./src/lib/adapters/billettoAdapter";
          import type { ExistingEventForDedup } from "./src/lib/adapters/pipeline";

          const KNOWN_OVERLAP_IDS = new Set(["1879852", "1968565", "1776752"]);
          // 1879852 = Infected Mushroom (Poolen, per poolen-program.html fixture)
          // 1968565 = Arcanum Collective: POSSESSED (Hangaren, per hangaren-events.html fixture)
          // 1776752 = Faustix - The Harder Techno Experience (Poolen, per poolen-program.html fixture)

          async function fetchAllCopenhagenEvents(accessKeyId: string, accessKeySecret: string): Promise<BillettoEvent[]> {
            const results: BillettoEvent[] = [];
            let after: string | null = null;
            for (let page = 1; page <= 25; page++) {
              const params = new URLSearchParams({ limit: "100", subregion: "Byen København" });
              if (after) params.set("after", after);
              const res = await fetch(`${BILLETTO_API_URL}?${params.toString()}`, {
                headers: { "Api-Keypair": buildApiKeypairHeader(accessKeyId, accessKeySecret), accept: "application/json" },
              });
              if (!res.ok) {
                console.error(`Billetto API page ${page} failed: HTTP ${res.status}`);
                break;
              }
              const body = (await res.json()) as { data: BillettoEvent[] };
              const events = body.data ?? [];
              console.log(`page ${page}: ${events.length} events`);
              results.push(...events);
              if (events.length < 100) break;
              const lastId = events[events.length - 1]?.id ?? null;
              if (!lastId || lastId === after) break;
              after = lastId;
            }
            return results;
          }

          async function main() {
            const accessKeyId = process.env.BILLETTO_ACCESS_KEY_ID!;
            const accessKeySecret = process.env.BILLETTO_ACCESS_KEY_SECRET!;
            const databaseUrl = process.env.DATABASE_URL!;

            console.log("=== Fetching live Billetto Copenhagen listing (subregion=Byen København, full pagination) ===");
            const liveEvents = await fetchAllCopenhagenEvents(accessKeyId, accessKeySecret);
            console.log(`Total live Copenhagen-scoped events fetched: ${liveEvents.length}`);

            const foundKnown = liveEvents.filter((e) => KNOWN_OVERLAP_IDS.has(e.id));
            console.log(`\n=== Known overlap candidate IDs found in the live Copenhagen listing: ${foundKnown.length} / ${KNOWN_OVERLAP_IDS.size} ===`);
            for (const e of foundKnown) {
              console.log(`  id=${e.id} title="${e.title}" venue="${e.location?.location_name}" start=${e.startdate} url=${e.url}`);
            }
            const missingIds = [...KNOWN_OVERLAP_IDS].filter((id) => !foundKnown.some((e) => e.id === id));
            if (missingIds.length > 0) {
              console.log(`Known IDs NOT found in the current live Copenhagen listing: ${missingIds.join(", ")}`);
            }

            const client = new Client({ connectionString: databaseUrl });
            try {
              await client.connect();
              await client.query("BEGIN");
              await client.query("SET LOCAL default_transaction_read_only = on");
              await client.query("SET LOCAL statement_timeout = '20s'");

              console.log("\n=== Stored Production events potentially matching known Billetto overlaps ===");
              const rows = await client.query(
                `SELECT id, title, artists, venue_id, start_datetime, official_event_url, ticket_url, resident_advisor_url,
                        other_source_urls, canonical_source_id, published, overridden_fields
                 FROM events
                 WHERE title ILIKE '%infected mushroom%'
                    OR title ILIKE '%possessed%'
                    OR title ILIKE '%arcanum%'
                    OR title ILIKE '%faustix%'
                 ORDER BY id`,
              );
              console.log(`Matching stored events: ${rows.rowCount}`);
              for (const r of rows.rows) console.log(" ", JSON.stringify(r));

              console.log("\n=== Running the REAL, unmodified dedup model for each known live Billetto event against every matching stored row ===");
              for (const billettoEvent of foundKnown) {
                const mapped = mapBillettoEvent(billettoEvent);
                if (!mapped) {
                  console.log(`\nBilletto event ${billettoEvent.id} ("${billettoEvent.title}") mapped to null (out of scope or unpublished) — no dedup to run.`);
                  continue;
                }
                console.log(`\n--- Billetto event ${billettoEvent.id}: "${mapped.title}" (officialEventUrl=${mapped.officialEventUrl}) ---`);
                console.log(`normalizeUrl(officialEventUrl) = ${normalizeUrl(mapped.officialEventUrl)}`);

                const existing: ExistingEventForDedup[] = rows.rows.map((r) => ({
                  id: r.id,
                  title: r.title,
                  artists: r.artists,
                  venueId: r.venue_id,
                  startDatetime: new Date(r.start_datetime).toISOString(),
                  sourceId: r.canonical_source_id,
                  officialEventUrl: r.official_event_url,
                  ticketUrl: r.ticket_url,
                  residentAdvisorUrl: r.resident_advisor_url,
                }));

                if (existing.length === 0) {
                  console.log("  No stored candidate rows to compare against.");
                  continue;
                }

                for (const ex of existing) {
                  console.log(`  vs stored event ${ex.id} ("${ex.title}"): storedTicketUrl=${ex.ticketUrl} normalizeUrl=${normalizeUrl(ex.ticketUrl ?? null)} storedOfficialEventUrl=${ex.officialEventUrl} normalizeUrl=${normalizeUrl(ex.officialEventUrl ?? null)}`);
                }

                const best = findBestDuplicateMatch(
                  {
                    title: mapped.title,
                    artists: mapped.artists,
                    venueId: existing[0]?.venueId ?? null,
                    startDatetime: mapped.startDatetime!,
                    sourceId: "src-billetto",
                    officialEventUrl: mapped.officialEventUrl,
                    ticketUrl: mapped.ticketUrl,
                    residentAdvisorUrl: null,
                  },
                  existing,
                );

                if (!best) {
                  console.log("  RESULT: no duplicate match found -> would be treated as a genuinely new event.");
                  continue;
                }
                console.log(`  RESULT: confidence=${best.assessment.confidence} reasons=${JSON.stringify(best.assessment.reasons)} matchedEventId=${best.match.id}`);
                const syncMatch = findSyncMatch(null, best.match.id, best.assessment.confidence);
                console.log(`  findSyncMatch (no prior provenance link) -> ${JSON.stringify(syncMatch)}`);
              }

              await client.query("ROLLBACK");
              console.log("\nTransaction rolled back (read-only).");
            } finally {
              await client.end();
            }
          }

          main().catch((err) => {
            console.error("VERIFICATION SCRIPT ERROR:", err);
            process.exitCode = 1;
          });
          SCRIPT

      - name: Run read-only overlap verification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BILLETTO_ACCESS_KEY_ID: ${{ secrets.BILLETTO_ACCESS_KEY_ID }}
          BILLETTO_ACCESS_KEY_SECRET: ${{ secrets.BILLETTO_ACCESS_KEY_SECRET }}
        run: node --import tsx ./.verify-billetto-overlap.ts

      - name: Remove local scratch script
        if: always()
        run: rm -f ./.verify-billetto-overlap.ts
