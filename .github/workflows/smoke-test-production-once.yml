name: Smoke Test Production (one-time)

# One-time, read-only Production smoke test after the Interaction +
# Venue Directory Quality merge. This sandbox's own network egress
# proxy blocks electroniccph.com directly, so this workflow runs the
# checks from a GitHub-hosted runner (unrestricted internet) instead.
# GET requests only — no writes, no secrets required (public site).
# Delete this workflow once the smoke test has run and been reviewed.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage
        run: |
          set -u
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' https://electroniccph.com/)
          echo "Homepage HTTP status: $code"
          echo "--- title ---"
          grep -o '<title>[^<]*</title>' /tmp/home.html || true
          echo "--- month nav ---"
          grep -o 'aria-label="Jump to month"' /tmp/home.html || echo "NOT FOUND: month nav"
          echo "--- event links present ---"
          grep -oE 'href="/events/[a-z0-9-]+"' /tmp/home.html | head -5 || echo "NOT FOUND: event links"
          echo "--- venue links present ---"
          grep -oE 'href="/venues/[a-z0-9-]+"' /tmp/home.html | head -5 || echo "NOT FOUND: venue links"
          echo "--- action link labels ---"
          grep -oE 'Official event|Tickets|Add to calendar' /tmp/home.html | sort -u || echo "NOT FOUND: action labels"
          echo "--- title link classes (sample) ---"
          grep -oE '<a href="/events/[^"]*"[^>]*class="[^"]*"' /tmp/home.html | head -1 || true
          echo "--- venue link classes (sample) ---"
          grep -oE '<a href="/venues/[^"]*"[^>]*class="[^"]*"' /tmp/home.html | head -1 || true

      - name: Venues overview
        run: |
          set -u
          code=$(curl -sS -o /tmp/venues.html -w '%{http_code}' https://electroniccph.com/venues)
          echo "Venues HTTP status: $code"
          echo "--- venue names (link text) ---"
          grep -oE '<a href="/venues/[a-z0-9-]+"[^>]*>[^<]*</a>' /tmp/venues.html || echo "NOT FOUND"
          echo "--- Bodega Danza check ---"
          grep -io 'Bodega Danza' /tmp/venues.html || echo "absent (expected)"
          echo "--- Sigurd CPH check ---"
          grep -io 'Sigurd CPH' /tmp/venues.html || echo "absent (expected)"
          echo "--- Cecil AM as standalone entry check ---"
          grep -oE '<a href="/venues/cecil-am"' /tmp/venues.html || echo "absent (expected — should be under hotel-cecil)"

      - name: Individual venue page (Hangaren)
        run: |
          set -u
          code=$(curl -sS -o /tmp/hangaren.html -w '%{http_code}' https://electroniccph.com/venues/hangaren)
          echo "Hangaren HTTP status: $code"
          echo "--- h1 ---"
          grep -oE '<h1[^>]*>[^<]*' /tmp/hangaren.html || true
          echo "--- venueProfile text sample (looking for a known phrase) ---"
          grep -o 'Hangaren occupies a raw industrial hangar' /tmp/hangaren.html || echo "NOT FOUND: venueProfile text"

      - name: Individual venue page (VEGA)
        run: |
          set -u
          code=$(curl -sS -o /tmp/vega.html -w '%{http_code}' https://electroniccph.com/venues/vega-ideal-bar)
          echo "VEGA HTTP status: $code"
          grep -oE '<h1[^>]*>[^<]*' /tmp/vega.html || true
          grep -o 'one of Vesterbro' /tmp/vega.html || echo "'one of Vesterbro...' absent (expected — sanitized)"
          grep -o 'basement club room' /tmp/vega.html || echo "NOT FOUND: expected venueProfile phrase"

      - name: About page
        run: |
          set -u
          code=$(curl -sS -o /tmp/about.html -w '%{http_code}' https://electroniccph.com/about)
          echo "About HTTP status: $code"
          grep -o 'the goal is to help you find the event, not to keep you inside this site' /tmp/about.html || echo "NOT FOUND: core About line"
          grep -o 'Suggest an event' /tmp/about.html || echo "NOT FOUND: Suggest an event link"
