name: QA Export to Private Repo (Read-Only)

# Daily, once per Copenhagen day between 01:00 and 05:15 (before the external
# ChatGPT QA at 06:00), plus manual start. Starts nothing else.
#
# 1. Exports every current (upcoming or in-progress) published event with
#    src/db/exportQaSnapshot.ts, logged in as the shared read-only report role
#    (DATABASE_URL_REPORT_RO, proven unable to write before any data is read).
# 2. Updates the QA control register qa-status.json with src/lib/qaStatusCli.ts:
#    applies ChatGPT's result files from qa-results/, then reconciles with the
#    new snapshot. This workflow is the ONLY writer of qa-status.json; ChatGPT
#    writes only files under qa-results/.
# 3. Commits snapshot, register and QA_INSTRUCTIONS.md to the PRIVATE
#    repository below. This repository is public, so nothing is uploaded as an
#    artifact or committed here, and logs show counts only.
#
# Needs two repository secrets:
#   DATABASE_URL_REPORT_RO  the existing read-only report role
#   QA_DATA_REPO_TOKEN      fine-grained token for the private repo only (Contents: read and write)

on:
  workflow_dispatch:
  schedule:
    # GitHub drops most scheduled runs in this repository (an hourly workflow here
    # fires ~2-3 times a day), so there are many attempts: every 10 minutes,
    # 23:07-03:57 UTC, which covers 01:00-05:00 Copenhagen in both CET and CEST.
    # The clock job lets at most one attempt per Copenhagen day export, and none
    # outside 01:00-05:15 Copenhagen time. Manual starts always run.
    - cron: "7-59/10 23 * * *"
    - cron: "7-59/10 0-3 * * *"

permissions:
  contents: read

concurrency:
  group: qa-export-readonly
  cancel-in-progress: false

env:
  QA_DATA_REPO: thomtorn-lab/electroniccph-qa-data
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - name: Allow one scheduled export per Copenhagen day, 01:00-05:15
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.QA_DATA_REPO_TOKEN }}
        # QA_CLOCK_NOW is never set in real runs; src/db/exportQaSnapshot.test.ts sets it to test the clock.
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manual start: exporting."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now="${QA_CLOCK_NOW:-now}"
          today="$(TZ=Europe/Copenhagen date -d "$now" +%F)"
          hhmm="$(TZ=Europe/Copenhagen date -d "$now" +%H%M)"
          if [ "$hhmm" \< "0100" ] || [ ! "$hhmm" \< "0515" ]; then
            echo "Copenhagen time ${hhmm:0:2}:${hhmm:2:2} is outside 01:00-05:15; not exporting."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/$QA_DATA_REPO/commits?path=qa-snapshot.json&per_page=1" --jq '.[0].commit.committer.date // ""')"
          last_day=""
          if [ -n "$last" ]; then last_day="$(TZ=Europe/Copenhagen date -d "$last" +%F)"; fi
          if [ "$last_day" = "$today" ]; then
            echo "A snapshot was already exported today ($last); not exporting again."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No snapshot yet today (last: ${last:-none}); exporting."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify secrets are configured
        env:
          DATABASE_URL_REPORT_RO: ${{ secrets.DATABASE_URL_REPORT_RO }}
          QA_DATA_REPO_TOKEN: ${{ secrets.QA_DATA_REPO_TOKEN }}
        run: |
          if [ -z "${DATABASE_URL_REPORT_RO:-}" ]; then
            echo "::error::Repository secret DATABASE_URL_REPORT_RO is not set."
            exit 1
          fi
          if [ -z "${QA_DATA_REPO_TOKEN:-}" ]; then
            echo "::error::Repository secret QA_DATA_REPO_TOKEN is not set."
            exit 1
          fi

      - name: Refuse unless the target repository is private
        env:
          GH_TOKEN: ${{ secrets.QA_DATA_REPO_TOKEN }}
        run: |
          visibility="$(gh api "repos/$QA_DATA_REPO" --jq '.visibility')"
          if [ "$visibility" != "private" ]; then
            echo "::error::$QA_DATA_REPO is not private (visibility: ${visibility:-unknown}). Nothing was exported."
            exit 1
          fi
          echo "$QA_DATA_REPO is private."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export QA snapshot (read-only)
        env:
          DATABASE_URL_REPORT_RO: ${{ secrets.DATABASE_URL_REPORT_RO }}
        run: node --import tsx src/db/exportQaSnapshot.ts --out="$RUNNER_TEMP/qa-snapshot.json"

      - name: Checkout private QA data repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.QA_DATA_REPO }}
          token: ${{ secrets.QA_DATA_REPO_TOKEN }}
          path: qa-data
          fetch-depth: 0

      - name: Refuse unless qa-status.json was last written by this workflow
        working-directory: qa-data
        run: |
          if [ ! -f qa-status.json ]; then
            echo "No qa-status.json yet; a new register will be started."
            exit 0
          fi
          author="$(git log -1 --format=%ae -- qa-status.json)"
          if [ "$author" != "$BOT_EMAIL" ]; then
            echo "::error::qa-status.json was last changed by someone other than this workflow ($author). Only this workflow may write it; ChatGPT writes qa-results/ only. Nothing was changed."
            exit 1
          fi

      - name: Update QA control register
        run: |
          node --import tsx src/lib/qaStatusCli.ts \
            --snapshot="$RUNNER_TEMP/qa-snapshot.json" \
            --status=qa-data/qa-status.json \
            --results-dir=qa-data/qa-results \
            --out="$RUNNER_TEMP/qa-status.json"

      - name: Commit snapshot and register to the private repository
        working-directory: qa-data
        run: |
          cp "$RUNNER_TEMP/qa-snapshot.json" qa-snapshot.json
          cp "$RUNNER_TEMP/qa-status.json" qa-status.json
          cp ../docs/qa-results-format.md QA_INSTRUCTIONS.md
          git add qa-snapshot.json qa-status.json QA_INSTRUCTIONS.md
          git -c user.name="github-actions[bot]" -c user.email="$BOT_EMAIL" \
            commit -q -m "QA snapshot and register $(date -u +%Y-%m-%dT%H:%MZ)"
          # ChatGPT may have added a result file meanwhile (other paths only): rebase once, never force.
          if ! git push -q origin HEAD; then
            git -c user.name="github-actions[bot]" -c user.email="$BOT_EMAIL" pull -q --rebase origin main
            git push -q origin HEAD
          fi
          echo "Snapshot and register committed to $QA_DATA_REPO."
