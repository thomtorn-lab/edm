name: Inspect Cross-Source Dedup Signals (Read-Only)

# One-off, manual, strictly read-only inspection of real Production data for
# the Electronic CPH cross-source duplicate-detection investigation
# (DIAGNOSIS ONLY — no code changes, no writes). Mirrors
# verify-db-readonly.yml's exact safe pattern: one dedicated pg connection,
# BEGIN, SET LOCAL default_transaction_read_only = on, only SELECT
# statements, always ROLLBACK, connection explicitly closed. No migration,
# no seed script, no application sync is ever run by this workflow.
#
# Pulls the fields relevant to duplicate-candidate analysis across the three
# current active ingestion sources (Hangaren, Culture Box, Poolen) so
# cross-source matches can be assessed by hand afterward: titles, artists,
# venue, start time, and every URL field (official/ticket/RA/other), plus
# discovery_queue's own suspected-duplicate pointer and source_event_links
# provenance. Does not depend on any unmerged Culture Box branch code — runs
# only read queries against whatever is already live in Production.
#
# DATABASE_URL is read only into this step's environment — never written to
# a file, never echoed, never logged.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Repository secret DATABASE_URL is not set (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run read-only dedup-signal inspection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cat > ./.inspect-dedup-readonly.mjs <<'EOF'
          import pg from "pg";

          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });

          function section(title) {
            console.log(`\n=== ${title} ===`);
          }

          try {
            await client.connect();
            await client.query("BEGIN");
            await client.query("SET LOCAL default_transaction_read_only = on");
            await client.query("SET LOCAL statement_timeout = '20s'");

            section("venues (id, name, aliases)");
            const ven = await client.query(
              `SELECT id, name, aliases FROM venues ORDER BY id`,
            );
            console.log(JSON.stringify(ven.rows, null, 2));

            section("sources health (Hangaren, Culture Box, Poolen)");
            const src = await client.query(
              `SELECT id, source_name, active, auto_publish, last_successful_sync, events_found, events_updated, last_error
               FROM sources WHERE id = ANY($1::text[]) ORDER BY id`,
              [["src-hangaren", "src-culture-box", "src-poolen"]],
            );
            console.log(JSON.stringify(src.rows, null, 2));

            section("ALL events: full duplicate-relevant field set");
            const ev = await client.query(
              `SELECT id, title, artists, venue_id, start_datetime, end_datetime,
                      official_event_url, ticket_url, facebook_url, resident_advisor_url, other_source_urls,
                      canonical_source_id, published, confidence, manual_override, overridden_fields, created_at
               FROM events ORDER BY start_datetime`,
            );
            console.log(`Total events: ${ev.rowCount}`);
            console.log(JSON.stringify(ev.rows, null, 2));

            section("ALL discovery_queue rows: full duplicate-relevant field set");
            const dq = await client.query(
              `SELECT id, probable_title, detected_lineup, probable_venue_name, probable_start,
                      source_id, source_name, source_url, suspected_duplicate_of_event_id,
                      status, overall_confidence, missing_fields, created_at
               FROM discovery_queue ORDER BY created_at`,
            );
            console.log(`Total discovery_queue rows: ${dq.rowCount}`);
            console.log(JSON.stringify(dq.rows, null, 2));

            section("ALL source_event_links: cross-source provenance");
            const links = await client.query(
              `SELECT event_id, source_id, source_url, role, first_seen_at
               FROM source_event_links ORDER BY event_id, source_id`,
            );
            console.log(`Total source_event_links rows: ${links.rowCount}`);
            console.log(JSON.stringify(links.rows, null, 2));

            section("events grouped by canonical_source_id (global)");
            const byCanonicalSource = await client.query(
              `SELECT canonical_source_id, count(*)::int AS n FROM events GROUP BY canonical_source_id ORDER BY canonical_source_id NULLS FIRST`,
            );
            console.log(JSON.stringify(byCanonicalSource.rows, null, 2));

            section("discovery_queue grouped by source_id + status (global)");
            const dqByStatus = await client.query(
              `SELECT source_id, status, count(*)::int AS n FROM discovery_queue GROUP BY source_id, status ORDER BY source_id NULLS FIRST, status`,
            );
            console.log(JSON.stringify(dqByStatus.rows, null, 2));

            section("candidate same-night pairs across different venues (raw signal, no scoring)");
            const sameNight = await client.query(
              `SELECT a.id AS event_a, a.title AS title_a, a.venue_id AS venue_a, a.canonical_source_id AS source_a,
                      b.id AS event_b, b.title AS title_b, b.venue_id AS venue_b, b.canonical_source_id AS source_b,
                      a.start_datetime AS start_a, b.start_datetime AS start_b
               FROM events a JOIN events b
                 ON a.id < b.id
                AND date_trunc('day', a.start_datetime AT TIME ZONE 'Europe/Copenhagen') = date_trunc('day', b.start_datetime AT TIME ZONE 'Europe/Copenhagen')
               ORDER BY a.start_datetime`,
            );
            console.log(`Same local-night event pairs (any venue/source): ${sameNight.rowCount}`);
            console.log(JSON.stringify(sameNight.rows, null, 2));

            await client.query("ROLLBACK");
            console.log("\nTransaction rolled back (read-only).");
          } catch (err) {
            try { await client.query("ROLLBACK"); } catch {}
            console.error("INSPECTION SCRIPT ERROR:", err);
            process.exitCode = 1;
          } finally {
            await client.end();
            console.log("Connection closed.");
          }
          EOF
          node ./.inspect-dedup-readonly.mjs
          rm -f ./.inspect-dedup-readonly.mjs
