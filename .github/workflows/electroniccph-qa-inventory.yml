name: ElectronicCPH QA inventory (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * *'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python qa/crawl_inventory.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: electroniccph-qa-inventory
          path: qa-inventory.json
          if-no-files-found: warn
          retention-days: 14
