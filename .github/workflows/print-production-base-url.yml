name: Print Production Base URL

# One-time, deliberately temporary workflow (post-merge live verification,
# 2026-08-29): prints the repository variable SYNC_BASE_URL (not a secret —
# it's the same public URL sync-hangaren.yml and friends already target) so
# a live Production homepage/venues/deployment check can be run against the
# correct URL. Removed after use, mirroring this repo's established
# temp-workflow convention.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - name: Print SYNC_BASE_URL
        env:
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        run: |
          if [ -z "${SYNC_BASE_URL}" ]; then
            echo "::error::Repository variable SYNC_BASE_URL is not set."
            exit 1
          fi
          echo "SYNC_BASE_URL=${SYNC_BASE_URL}"
