name: Send Newsletter

# Weekly newsletter MVP (2026-10-05). Calls the deployed app's
# POST /api/newsletter/send, same auth/trigger pattern every sync workflow
# already uses (x-sync-token against SYNC_TRIGGER_TOKEN, x-vercel-
# protection-bypass against VERCEL_AUTOMATION_BYPASS_SECRET) — see
# sync-hangaren.yml, which this file deliberately mirrors almost exactly.
#
# One-time setup after deploying the app: the same three repository
# variables/secrets sync-hangaren.yml already documents (SYNC_BASE_URL,
# SYNC_TRIGGER_TOKEN, VERCEL_AUTOMATION_BYPASS_SECRET) — nothing new to
# configure for this workflow specifically.
#
# NO AUTOMATIC SCHEDULE YET (deployment-safety requirement, 2026-10-05):
# this workflow is deliberately workflow_dispatch-only, mirroring
# youtube-preview-backfill.yml's own "built and validated, but paused
# before going live" precedent. The send route itself is independently
# gated behind the NEWSLETTER_SIGNUP_ENABLED env var (see
# src/lib/newsletter/featureFlag.ts) — even a manual dispatch here can't
# send real email until a human sets that flag, so the two safety layers
# are intentionally redundant.
#
# PREPARED BUT NOT ACTIVATED (newsletter activation safety round,
# 2026-10-06): the "DST-safe schedule eligibility guard" step below is
# fully built and tested (src/lib/newsletter/dstSchedule.ts), but has no
# effect at all right now — it only runs `if: github.event_name ==
# 'schedule'`, and no `schedule:` trigger exists yet below, so that
# condition can never be true and workflow_dispatch stays completely
# unaffected for manual testing. When ready to go live, add exactly these
# two lines under `on:`:
#
#   schedule:
#     - cron: "0 8 * * 4"   # Thursday 10:00 CPH during CEST (UTC+2, Mar-Nov)
#     - cron: "0 9 * * 4"   # Thursday 10:00 CPH during CET (UTC+1, Nov-Mar)
#
# Both firing every Thursday is intentional, not a bug: the guard step
# below decides which ONE of them is this week's DST-correct firing using
# only the nominal cron string (`github.event.schedule`) and Denmark's
# current UTC offset — never the actual execution clock time, so a run
# GitHub Actions starts late is still judged correctly (see
# dstSchedule.ts's own doc comment for exactly why). The seasonally wrong
# firing exits as a no-op before ever calling the app, so there is exactly
# one REAL weekly invocation, not two muted by idempotency alone — the
# send route's existing per-(subscriber, ISO week) idempotency
# (db/newsletter.ts's queuePendingSendsForWeek) remains as pure
# defense-in-depth underneath this guard, never the primary mechanism.

on:
  workflow_dispatch: {} # manual trigger only, for now — see note above; unaffected by the prepared schedule guard below

concurrency:
  group: send-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # The three steps below exist solely for the DST-safe schedule guard
      # and only ever run `if: github.event_name == 'schedule'` — with no
      # `schedule:` trigger configured yet (see the top-of-file note), that
      # condition is never true, so a manual workflow_dispatch run executes
      # exactly as it did before this guard was added: straight to "Trigger
      # newsletter send" below, no extra checkout/setup cost.
      - name: Checkout (schedule guard only)
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Set up Node.js (schedule guard only)
        if: github.event_name == 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (schedule guard only)
        if: github.event_name == 'schedule'
        run: npm ci

      - name: DST-safe schedule eligibility guard
        if: github.event_name == 'schedule'
        id: guard
        run: |
          OFFSET=$(TZ=Europe/Copenhagen date +%z)
          echo "Copenhagen UTC offset today: ${OFFSET}; this run's cron: ${{ github.event.schedule }}"
          if node --import tsx scripts/checkDstEligibility.ts "${{ github.event.schedule }}" "$OFFSET"; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Not today's DST-correct firing — the other prepared cron entry is this week's intended one. Exiting as a no-op without calling the app."
          fi

      - name: Trigger newsletter send
        if: github.event_name != 'schedule' || steps.guard.outputs.eligible == 'true'
        env:
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          if [ -z "${SYNC_BASE_URL}" ]; then
            echo "::error::Repository variable SYNC_BASE_URL is not set — point it at the deployed app's base URL (Settings > Secrets and variables > Actions > Variables) before this workflow can do anything."
            exit 1
          fi
          if [ -z "${SYNC_TRIGGER_TOKEN}" ]; then
            echo "::error::Repository secret SYNC_TRIGGER_TOKEN is not set (Settings > Secrets and variables > Actions > Secrets), or doesn't match the deployment's SYNC_TRIGGER_TOKEN env var."
            exit 1
          fi
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]; then
            echo "::error::Repository secret VERCEL_AUTOMATION_BYPASS_SECRET is not set (Settings > Secrets and variables > Actions > Secrets), or doesn't match the bypass secret configured on the Vercel project."
            exit 1
          fi

          # Higher --max-time than a routine source sync: this fans out to
          # every confirmed subscriber in one request rather than one
          # source's events, though at this project's realistic subscriber
          # counts it should still complete in well under a minute.
          http_code=$(curl -sS \
            --retry 2 --retry-delay 15 --retry-all-errors \
            --max-time 180 \
            -o /tmp/newsletter-send-response.json -w '%{http_code}' \
            -X POST \
            -H "x-sync-token: ${SYNC_TRIGGER_TOKEN}" \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${SYNC_BASE_URL}/api/newsletter/send")

          echo "HTTP status: ${http_code}"
          echo "Response:"
          cat /tmp/newsletter-send-response.json
          echo

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Newsletter send returned HTTP ${http_code} — see response body above."
            exit 1
          fi
